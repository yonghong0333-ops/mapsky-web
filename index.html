<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>MapSky</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <script>
  (async function () {
    try {
      var res = await fetch(
        'https://cdn.jsdelivr.net/gh/yonghong0333-ops/mapsky-web@ff94f146fd204f7b927a81f91c08f293c353c5c5/index.html',
        { cache: 'no-store' }
      );
      var html = await res.text();
      var doc = new DOMParser().parseFromString(html, 'text/html');

      Array.from(doc.head.children).forEach(function (node) {
        if (node.tagName === 'SCRIPT') return;
        if (node.tagName === 'TITLE') {
          document.title = node.textContent;
          return;
        }
        document.head.appendChild(document.importNode(node, true));
      });

      document.body.className = doc.body.className;
      document.body.innerHTML = doc.body.innerHTML;

      document.querySelectorAll('img[data-logo="icon"]').forEach(function (img) {
        if (!img.getAttribute('src')) img.src = 'assets/icon.png';
      });

      function setMenu(open) {
        var toggle = document.getElementById('navToggle');
        var nav = document.getElementById('topNav');
        var navRight = document.getElementById('navRight');
        document.body.classList.toggle('nav-open', !!open);
        if (nav) nav.classList.toggle('nav-open', !!open);
        if (toggle) {
          toggle.classList.toggle('open', !!open);
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        }
        if (navRight) navRight.classList.toggle('open', !!open);
      }

      var toggle = document.getElementById('navToggle');
      var navRight = document.getElementById('navRight');
      if (toggle) {
        toggle.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          setMenu(!document.body.classList.contains('nav-open'));
        });
      }
      if (navRight) {
        navRight.querySelectorAll('a').forEach(function (a) {
          a.addEventListener('click', function () { setMenu(false); });
        });
      }

      window.addEventListener('scroll', function () {
        document.body.classList.toggle('is-scrolled', window.scrollY > 8);
      }, { passive: true });

      ['logo-icon.js', 'logo-apply.js', 'auth.js'].forEach(function (src) {
        var s = document.createElement('script');
        s.src = src;
        document.body.appendChild(s);
      });

      var full = document.createElement('style');
      full.textContent = [
        '.black-band{min-height:100vh!important;min-height:100dvh!important;width:100%!important;max-width:none!important;box-sizing:border-box;}',
        '.stage{width:100%!important;max-width:none!important;overflow:visible!important;}',
        '.torn-edge{position:relative!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;width:100vw!important;max-width:100vw!important;margin:0!important;height:64px!important;overflow:visible!important;z-index:6!important;}',
        '.torn-svg{width:100%!important;height:64px!important;display:block!important;}',
        '.sticker{z-index:8!important;}',
        '.st-sun{left:4%!important;bottom:-24px!important;}',
        '.st-rain{right:5%!important;bottom:-16px!important;}',
        '.sheet{margin-top:-40px!important;position:relative!important;z-index:1!important;width:100%!important;}',
        '.block-news,.block-news.block,#features.block-news,.block{border-top:none!important;}',
        '.block-news{border:none!important;box-shadow:none!important;}',
        '.card-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;max-width:720px;margin-left:auto;margin-right:auto;}',
        '.fcard-ico img{width:56px!important;height:56px!important;object-fit:contain!important;display:block!important;margin:0 auto;}',
        '.fcard-iphone{cursor:pointer!important;}',
        '.iphone-modal-overlay{position:fixed!important;inset:0!important;z-index:9999!important;background:rgba(0,0,0,.55)!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:24px!important;opacity:0!important;pointer-events:none!important;transition:opacity .25s ease!important;}',
        '.iphone-modal-overlay.open{opacity:1!important;pointer-events:auto!important;}',
        '.iphone-modal{background:#1c1c1e!important;color:#f5f5f7!important;border-radius:20px!important;padding:28px 24px 24px!important;width:min(100%,360px)!important;box-shadow:0 20px 60px rgba(0,0,0,.45)!important;transform:scale(.94) translateY(12px)!important;transition:transform .25s ease!important;}',
        '.iphone-modal-overlay.open .iphone-modal{transform:scale(1) translateY(0)!important;}',
        '.iphone-modal h3{margin:0 0 8px!important;font-size:20px!important;font-weight:700!important;color:#f5f5f7!important;text-align:center!important;}',
        '.iphone-modal .modal-lead{margin:0 0 18px!important;font-size:14px!important;color:#a1a1a6!important;text-align:center!important;}',
        '.iphone-modal ul{list-style:none!important;margin:0!important;padding:0!important;display:flex!important;flex-direction:column!important;gap:8px!important;}',
        '.iphone-modal li{background:#2c2c2e!important;border-radius:12px!important;padding:12px 14px!important;font-size:15px!important;color:#f5f5f7!important;line-height:1.4!important;}',
        '.iphone-modal .modal-close{display:block!important;width:100%!important;margin-top:18px!important;padding:12px!important;border:0!important;border-radius:12px!important;background:#3a3a3c!important;color:#f5f5f7!important;font-size:15px!important;font-weight:600!important;cursor:pointer!important;font-family:inherit!important;}',
        '.iphone-modal .modal-close:hover{background:#48484a!important;}',
        '.torn-mid{position:relative!important;left:50%!important;transform:translateX(-50%)!important;width:100vw!important;max-width:100vw!important;height:64px!important;margin:20px 0 12px!important;padding:0!important;line-height:0!important;pointer-events:none!important;background:transparent!important;overflow:hidden!important;z-index:3!important;border:0!important;}',
        '.torn-mid-svg{display:block!important;width:100%!important;height:80px!important;margin-top:-10px!important;filter:drop-shadow(0 10px 8px rgba(0,0,0,.18)) drop-shadow(0 3px 2px rgba(0,0,0,.12));}',
        '@media (max-width:560px){.torn-edge,.torn-svg{height:52px!important;}.torn-mid{height:56px!important;}.torn-mid-svg{height:72px!important;margin-top:-10px!important;}.st-sun{width:96px!important;}.st-rain{width:100px!important;}.card-grid{grid-template-columns:1fr!important;}}'
      ].join('');
      document.head.appendChild(full);

      var features = document.getElementById('features');
      if (features) {
        features.innerHTML = [
          '<h2 id="features-title">適用裝置</h2>',
          '<p class="block-lead">在常用裝置上都能用 MapSky。</p>',
          '<ul class="card-grid">',
          '<li class="fcard fcard-iphone" role="button" tabindex="0" aria-label="查看 iPhone 適用機型">',
          '  <div class="fcard-ico" aria-hidden="true">',
          '    <img src="assets/iphone.png" alt="" width="56" height="56" loading="lazy" />',
          '  </div>',
          '  <div><h3>iPhone</h3><p>iOS App，完整天氣、班次與停班停課。</p></div>',
          '</li>',
          '<li class="fcard">',
          '  <div class="fcard-ico" aria-hidden="true">',
          '    <img src="assets/ipad.png" alt="" width="56" height="56" loading="lazy" />',
          '  </div>',
          '  <div><h3>iPad</h3><p>大螢幕瀏覽，適合在家一次看清。</p></div>',
          '</li>',
          '<li class="fcard">',
          '  <div class="fcard-ico" aria-hidden="true">',
          '    <img src="assets/mac.png" alt="" width="56" height="56" loading="lazy" />',
          '  </div>',
          '  <div><h3>Mac</h3><p>在 Mac 瀏覽器開啟，大畫面一次掌握。</p></div>',
          '</li>',
          '</ul>'
        ].join('');
      }

      if (features && !document.querySelector('.torn-mid')) {
        var div = document.createElement('div');
        div.className = 'torn-mid';
        div.setAttribute('aria-hidden', 'true');
        div.innerHTML = '<svg class="torn-mid-svg" viewBox="0 0 1200 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0,0 L1200,0 L1200,22 L1185,52 L1170,26 L1152,62 L1138,28 L1118,56 L1102,24 L1080,66 L1064,28 L1044,54 L1028,22 L1008,64 L990,26 L968,58 L950,24 L928,66 L910,28 L888,54 L870,22 L848,66 L830,26 L808,56 L790,24 L768,64 L750,28 L728,52 L710,22 L688,66 L670,26 L648,56 L630,24 L608,64 L590,28 L568,54 L550,22 L528,66 L510,26 L488,58 L470,24 L448,64 L430,28 L408,52 L390,22 L368,66 L350,26 L328,56 L310,24 L288,64 L270,28 L248,54 L230,22 L208,66 L190,26 L168,58 L150,24 L128,64 L110,28 L88,52 L70,22 L48,66 L30,26 L12,56 L0,28 Z" fill="#ffffff"/></svg>';
        features.parentNode.insertBefore(div, features);
      }

      if (!document.getElementById('iphoneModal')) {
        var ov = document.createElement('div');
        ov.id = 'iphoneModal';
        ov.className = 'iphone-modal-overlay';
        ov.setAttribute('role', 'dialog');
        ov.setAttribute('aria-modal', 'true');
        ov.setAttribute('aria-labelledby', 'iphoneModalTitle');
        ov.innerHTML = [
          '<div class="iphone-modal">',
          '  <h3 id="iphoneModalTitle">適用機型</h3>',
          '  <p class="modal-lead">iPhone 支援下列機型</p>',
          '  <ul>',
          '    <li>iPhone 11 – 17（含 Pro、Pro Max）</li>',
          '    <li>iPhone 18 Pro</li>',
          '    <li>iPhone 18 Pro Max</li>',
          '  </ul>',
          '  <button type="button" class="modal-close" id="iphoneModalClose">關閉</button>',
          '</div>'
        ].join('');
        document.body.appendChild(ov);
        function closeIphoneModal() { ov.classList.remove('open'); }
        function openIphoneModal() { ov.classList.add('open'); }
        ov.addEventListener('click', function (e) {
          if (e.target === ov) closeIphoneModal();
        });
        document.getElementById('iphoneModalClose').addEventListener('click', closeIphoneModal);
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeIphoneModal();
        });
        document.querySelectorAll('.fcard-iphone').forEach(function (card) {
          card.addEventListener('click', openIphoneModal);
          card.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openIphoneModal();
            }
          });
        });
      }

      document.querySelectorAll('a[href="#features"]').forEach(function (a) {
        if (a.textContent.trim() === '功能') a.textContent = '適用裝置';
      });
    } catch (e) {
      document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">載入失敗，請重新整理。<br>' + e + '</p>';
      console.error(e);
    }
  })();
  </script>
</head>
<body style="margin:0;background:#0a0a0a;color:#f5f5f7;font-family:-apple-system,sans-serif">
  <p style="padding:24px;color:#6e6e73">載入 MapSky…</p>
</body>
</html>
