<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="MapSky — 台灣天氣、停班停課、捷運台鐵高鐵與動態天空，一站掌握。" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>MapSky</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <style>
    #menuCloseBtn {
      display: none;
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 99999;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 28px;
      line-height: 44px;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body.nav-open #menuCloseBtn { display: block; }
  </style>
  <script>
  (async function () {
    try {
      var res = await fetch('https://cdn.jsdelivr.net/gh/yonghong0333-ops/mapsky-web@ff94f146fd204f7b927a81f91c08f293c353c5c5/index.html', { cache: 'no-store' });
      var html = await res.text();
      document.open();
      document.write(html);
      document.close();

      function setMenu(open) {
        var toggle = document.getElementById('navToggle');
        var nav = document.getElementById('topNav');
        var navRight = document.getElementById('navRight');
        document.body.classList.toggle('nav-open', open);
        if (nav) nav.classList.toggle('nav-open', open);
        if (toggle) {
          toggle.classList.toggle('open', open);
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        }
        if (navRight) navRight.classList.toggle('open', open);
        var closeBtn = document.getElementById('menuCloseBtn');
        if (closeBtn) closeBtn.style.display = open ? 'block' : 'none';
      }

      function wireUp() {
        document.querySelectorAll('img[data-logo="icon"]').forEach(function (img) {
          if (!img.getAttribute('src')) img.src = 'assets/icon.png';
        });

        // Dedicated close button always on top
        if (!document.getElementById('menuCloseBtn')) {
          var closeBtn = document.createElement('button');
          closeBtn.id = 'menuCloseBtn';
          closeBtn.type = 'button';
          closeBtn.setAttribute('aria-label', '關閉選單');
          closeBtn.innerHTML = '&times;';
          closeBtn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            setMenu(false);
          });
          document.body.appendChild(closeBtn);
        }

        var toggle = document.getElementById('navToggle');
        var nav = document.getElementById('topNav');
        var navRight = document.getElementById('navRight');
        if (toggle && !toggle.getAttribute('data-wired')) {
          toggle.setAttribute('data-wired', '1');
          toggle.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            var open = !document.body.classList.contains('nav-open');
            setMenu(open);
          }, { passive: false });
        }
        if (navRight && !navRight.getAttribute('data-wired')) {
          navRight.setAttribute('data-wired', '1');
          navRight.querySelectorAll('a').forEach(function (a) {
            a.addEventListener('click', function () { setMenu(false); });
          });
        }

        if (!window.__mapskyScrollWired) {
          window.__mapskyScrollWired = true;
          window.addEventListener('scroll', function () {
            document.body.classList.toggle('is-scrolled', window.scrollY > 8);
          }, { passive: true });
        }

        if (!window.__mapskyScriptsWired) {
          window.__mapskyScriptsWired = true;
          var s1 = document.createElement('script');
          s1.src = 'logo-icon.js';
          s1.onload = function () {
            var s2 = document.createElement('script');
            s2.src = 'logo-apply.js';
            document.body.appendChild(s2);
          };
          document.body.appendChild(s1);
          var s3 = document.createElement('script');
          s3.src = 'auth.js';
          document.body.appendChild(s3);
        }
      }

      requestAnimationFrame(wireUp);
      setTimeout(wireUp, 50);
      setTimeout(wireUp, 200);
      setTimeout(wireUp, 600);
    } catch (e) {
      document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">載入失敗，請重新整理。</p>';
      console.error(e);
    }
  })();
  </script>
</head>
<body>
  <p style="padding:24px;font-family:-apple-system,sans-serif;color:#6e6e73">載入 MapSky…</p>
</body>
</html>
