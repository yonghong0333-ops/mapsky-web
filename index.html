<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>MapSky</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <script>
  (async function () {
    try {
      var res = await fetch(
        'https://cdn.jsdelivr.net/gh/yonghong0333-ops/mapsky-web@ff94f146fd204f7b927a81f91c08f293c353c5c5/index.html',
        { cache: 'no-store' }
      );
      var html = await res.text();
      var doc = new DOMParser().parseFromString(html, 'text/html');

      Array.from(doc.head.children).forEach(function (node) {
        if (node.tagName === 'SCRIPT') return;
        if (node.tagName === 'TITLE') {
          document.title = node.textContent;
          return;
        }
        document.head.appendChild(document.importNode(node, true));
      });

      document.body.className = doc.body.className;
      document.body.innerHTML = doc.body.innerHTML;

      document.querySelectorAll('img[data-logo="icon"]').forEach(function (img) {
        if (!img.getAttribute('src')) img.src = 'assets/icon.png';
      });

      function setMenu(open) {
        var toggle = document.getElementById('navToggle');
        var nav = document.getElementById('topNav');
        var navRight = document.getElementById('navRight');
        document.body.classList.toggle('nav-open', !!open);
        if (nav) nav.classList.toggle('nav-open', !!open);
        if (toggle) {
          toggle.classList.toggle('open', !!open);
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        }
        if (navRight) navRight.classList.toggle('open', !!open);
      }

      var toggle = document.getElementById('navToggle');
      var navRight = document.getElementById('navRight');
      if (toggle) {
        toggle.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          setMenu(!document.body.classList.contains('nav-open'));
        });
      }
      if (navRight) {
        navRight.querySelectorAll('a').forEach(function (a) {
          a.addEventListener('click', function () { setMenu(false); });
        });
      }

      window.addEventListener('scroll', function () {
        document.body.classList.toggle('is-scrolled', window.scrollY > 8);
      }, { passive: true });

      ['logo-icon.js', 'logo-apply.js', 'auth.js'].forEach(function (src) {
        var s = document.createElement('script');
        s.src = src;
        document.body.appendChild(s);

      document.head.appendChild(full);
      var ovFix = document.createElement('style');

      document.head.appendChild(ovFix);

          var vis = visibleSeries();
          if (vis.every(function (s) { return s.id !== seriesId; })) {
            seriesId = vis[0] ? vis[0].id : '18';
          }
          seriesEl.innerHTML = vis.map(function (s) {
            return '<button type="button" data-series="' + s.id + '" class="' + (s.id === seriesId ? 'on' : '') + '" role="tab">' + s.label.replace('iPhone ', '') + '</button>';
          }).join('');
          seriesEl.querySelectorAll('button').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var next = btn.getAttribute('data-series');
              if (next === seriesId) return;
              seriesId = next;
              seriesEl.querySelectorAll('button').forEach(function (b) {
                b.classList.toggle('on', b.getAttribute('data-series') === seriesId);
              });
              renderModels(true);
            });
          });
        }
        function fillModels() {
          var s = SERIES.filter(function (x) { return x.id === seriesId; })[0];
          if (!s) return;
          var list = s.models.filter(function (m) { return mode === 'all' || m.adventure; });
          if (!list.length) {
            modelsEl.innerHTML = '<p class="modal-section-desc" style="margin:0">此系列在「動態冒險效果」模式下無可支援機型。請改選 iPhone 14 Pro 以上系列。</p>';
          } else {
            modelsEl.innerHTML = '<ul>' + list.map(function (m) {
              var sub = m.adventure ? '支援 MapSky 動態冒險效果' : '支援標準功能';
              return '<li>' + m.name + '<span>' + sub + '</span></li>';
            }).join('') + '</ul>';
          }
          noteEl.textContent = mode === 'adventure'
            ? '動態冒險效果需 iPhone 14 Pro 以上機型。'
            : '完整功能需升級至 iOS 26。動態冒險效果需 iPhone 14 Pro 以上。';
        }
        function renderModels(animate) {
          if (swapTimer) { clearTimeout(swapTimer); swapTimer = null; }
          if (!animate) {
            modelsEl.classList.remove('is-swap');
            fillModels();
            return;
          }
          var prevH = modelsEl.offsetHeight;
          if (prevH > 0) modelsEl.style.minHeight = prevH + 'px';
          fillModels();
          modelsEl.classList.add('is-swap');
          void modelsEl.offsetWidth;
          requestAnimationFrame(function () {
            modelsEl.classList.remove('is-swap');
            swapTimer = setTimeout(function () {
              modelsEl.style.minHeight = '';
              swapTimer = null;
            }, 200);
          });
        }
        document.getElementById('iphoneSeg').querySelectorAll('button').forEach(function (btn) {
          btn.addEventListener('click', function () {
            mode = btn.getAttribute('data-mode');
            document.getElementById('iphoneSeg').querySelectorAll('button').forEach(function (b) {
              b.classList.toggle('on', b === btn);
              b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
            });
            if (mode === 'adventure' && ['13','12','11','se'].indexOf(seriesId) >= 0) {
              seriesId = '14';
            }
            renderSeriesTabs();
            renderModels(true);
          });
        });
        renderSeriesTabs();
        renderModels(false);
        var scrollY = 0;
        function closeIphoneModal() {
          if (!ov.classList.contains('open')) return;
          var y = scrollY;
          ov.classList.remove('open');
          document.documentElement.classList.remove('iphone-modal-open');
          document.body.classList.remove('iphone-modal-open');
          // 同一幀內解除 fixed 並立刻還原捲動，避免先跳頂
          document.body.style.position = '';
          document.body.style.top = '';
          document.body.style.left = '';
          document.body.style.right = '';
          document.body.style.width = '';
          document.body.style.overflow = '';
          document.documentElement.style.overflow = '';
          document.documentElement.style.scrollBehavior = 'auto';
          window.scrollTo(0, y);
          document.documentElement.scrollTop = y;
          document.body.scrollTop = y;
          setTimeout(function () {
            window.scrollTo(0, y);
            document.documentElement.style.scrollBehavior = '';
          }, 0);
        }
        function openIphoneModal(e) {
          if (e) { e.preventDefault(); e.stopPropagation(); }
          if (ov.classList.contains('open')) return;
          scrollY = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
          document.documentElement.classList.add('iphone-modal-open');
          document.body.classList.add('iphone-modal-open');
          document.documentElement.style.overflow = 'hidden';
          document.body.style.overflow = 'hidden';
          ov.classList.add('open');
          var x = document.getElementById('iphoneModalClose');
          if (x && x.focus) try { x.focus({ preventScroll: true }); } catch (err) {}
        }
        ov.addEventListener('click', function (e) {
          if (e.target === ov) closeIphoneModal();
        });
        ov.addEventListener('wheel', function (e) {
          if (!e.target.closest('.iphone-modal')) e.preventDefault();
        }, { passive: false });
        ov.addEventListener('touchmove', function (e) {
          if (!e.target.closest('.iphone-modal')) e.preventDefault();
        }, { passive: false });
        document.getElementById('iphoneModalClose').addEventListener('click', closeIphoneModal);
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeIphoneModal();
        });
        document.querySelectorAll('.fcard-iphone').forEach(function (card) {
          card.addEventListener('click', openIphoneModal);
          card.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openIphoneModal();
            }
          });
        });
      }

      document.querySelectorAll('a[href="#features"]').forEach(function (a) {
        if (a.textContent.trim() === '功能') a.textContent = '適用裝置';
      });
    } catch (e) {
      document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">載入失敗，請重新整理。<br>' + e + '</p>';
      console.error(e);
    }
  })();
  </script>
</head>

  <p style="padding:24px;color:#6e6e73">載入 MapSky…</p>
</body>
