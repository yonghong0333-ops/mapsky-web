<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="MapSky — 台灣天氣、停班停課、捷運台鐵高鐵與動態天空，一站掌握。" />
  <meta name="theme-color" content="#ffffff" />
  <meta property="og:title" content="MapSky" />
  <meta property="og:description" content="台灣天氣 · 交通 · 停班停課 · 動態天空" />
  <meta property="og:type" content="website" />
  <title>MapSky</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.home {
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    body.home .nav {
      background: rgba(255,255,255,0.86);
      color: #1d1d1f;
    }
    body.home .wordmark { filter: brightness(0); }
    body.home .nav-toggle { background: rgba(0,0,0,0.06); }
    body.home .nav-toggle span { background: currentColor; }
    body.home .nav .btn-primary { background: #1d1d1f; color: #fff; }
    main#top {
      flex: 1;
      min-height: 36vh;
      background: #fff;
    }
    .site-footer {
      background: #f5f5f7;
      color: #6e6e73;
      font-size: 13px;
      line-height: 1.5;
      padding: 48px 22px 28px;
      margin-top: auto;
      border-top: 1px solid #d2d2d7;
    }
    .site-footer-inner {
      max-width: 920px;
      margin: 0 auto;
    }
    .footer-brand-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      padding-bottom: 28px;
      border-bottom: 1px solid #d2d2d7;
    }
    .footer-logo-lockup {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .footer-logo-lockup .footer-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: block;
      flex-shrink: 0;
    }
    .footer-logo-lockup .footer-word {
      width: min(140px, 38vw);
      height: auto;
      display: block;
      filter: invert(1);
    }
    .footer-brand-block p {
      margin: 0;
      max-width: 420px;
      font-size: 13px;
      color: #6e6e73;
    }
    .footer-link-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 20px;
      padding: 22px 0;
      border-bottom: 1px solid #d2d2d7;
    }
    .footer-link-row a {
      color: #1d1d1f;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }
    .footer-link-row a:hover {
      color: #0066cc;
    }
    .footer-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 18px;
      font-size: 12px;
      color: #6e6e73;
    }
    .footer-meta a {
      color: #6e6e73;
      text-decoration: none;
      margin-left: 14px;
    }
    .footer-meta a:first-of-type { margin-left: 0; }
    .footer-meta a:hover { color: #1d1d1f; text-decoration: underline; }
    @media (max-width: 560px) {
      .footer-meta {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
    }
  </style>
</head>
<body class="home">
  <header class="nav" id="topNav">
    <a class="brand" href="/">
      <img class="logo-img" data-logo="icon" width="36" height="36" alt="MapSky" />
      <img class="wordmark" data-logo="wordmark" height="22" alt="MapSky" />
    </a>
    <button type="button" class="nav-toggle" id="navToggle" aria-label="開啟選單" aria-expanded="false">
      <span></span><span></span>
    </button>
    <div class="nav-right" id="navRight">
      <nav class="nav-links" aria-label="主選單">
        <a href="/features">畫面</a>
        <a href="/features">最新消息</a>
        <a href="/features">功能</a>
        <a href="/privacy">隱私與條款</a>
      </nav>
      <div class="nav-actions">
        <span data-auth-slot>
          <a class="btn btn-sm btn-primary" href="/login">登入</a>
        </span>
      </div>
    </div>
  </header>

  <main id="top"></main>

  <footer class="site-footer" role="contentinfo">
    <div class="site-footer-inner">
      <div class="footer-brand-block">
        <div class="footer-logo-lockup">
          <img class="footer-icon" src="assets/icon.png" width="28" height="28" alt="MapSky" />
          <img class="footer-word" src="assets/wordmark.png" width="140" height="36" alt="MAPSKY" />
        </div>
        <p>天氣、班次、停班停課，一站看清楚。</p>
      </div>

      <nav class="footer-link-row" aria-label="頁尾連結">
        <a href="/features">功能</a>
        <a href="/features">畫面</a>
        <a href="/features">最新消息</a>
        <a href="/login">登入</a>
        <a href="/privacy">隱私與條款</a>
        <a href="mailto:mapskyapp@gmail.com">聯絡我們</a>
      </nav>

      <div class="footer-meta">
        <span>Copyright © MapSky</span>
        <span>
          <a href="/privacy">隱私權政策</a>
          <a href="/privacy">使用條款</a>
          <a href="mailto:mapskyapp@gmail.com">mapskyapp@gmail.com</a>
        </span>
      </div>
    </div>
  </footer>

  <script src="logo-icon.js"></script>
  <script src="logo-wordmark.js"></script>
  <script src="logo-apply.js"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      var toggle = document.getElementById("navToggle");
      var panel = document.getElementById("navRight");
      if (toggle && panel) {
        toggle.addEventListener("click", function () {
          var open = panel.classList.toggle("open");
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
          toggle.classList.toggle("open", open);
          document.body.classList.toggle("nav-open", open);
        });
        panel.querySelectorAll("a").forEach(function (a) {
          a.addEventListener("click", function () {
            panel.classList.remove("open");
            document.body.classList.remove("nav-open");
            toggle.classList.remove("open");
            toggle.setAttribute("aria-expanded", "false");
          });
        });
      }
    })();
  </script>
</body>
</html>
