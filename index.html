<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="MapSky — 台灣天氣、停班停課、捷運台鐵高鐵與動態天空，一站掌握。" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta property="og:title" content="MapSky" />
  <meta property="og:description" content="台灣天氣 · 交通 · 停班停課 · 動態天空" />
  <meta property="og:type" content="website" />
  <title>MapSky</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.home {
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    body.home .nav {
      background: rgba(10,10,10,0.72);
      color: #f5f5f7;
    }
    body.home .nav .btn-primary { background: #f5f5f7; color: #0a0a0a; }
    body.home .nav-toggle { background: rgba(255,255,255,0.12); }
    body.home .nav-toggle span { background: #f5f5f7; }
    body.home .nav-toggle, body.home .nav-links a, body.home .nav .btn { touch-action: manipulation; }

    body.home { --nav-h: 72px; }
    body.home .brand { gap: 12px; }
    body.home .logo-img { width: 52px; height: 52px; border-radius: 12px; }
    body.home .wordmark { height: 28px; width: auto; filter: none !important; }
    body.home .nav-right { gap: 28px; }
    body.home .nav-links { font-size: 18px; gap: 26px; }
    body.home .nav .btn-sm { padding: 10px 18px; font-size: 16px; }

    main#top {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .black-band {
      position: relative;
      background: #0a0a0a;
      color: #f5f5f7;
      min-height: 52vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-h, 52px) + env(safe-area-inset-top, 0px) + 32px) 24px 72px;
      text-align: center;
      z-index: 2;
      overflow: hidden;
    }
    .black-band .eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 14px;
    }
    .black-band h1 {
      font-size: clamp(28px, 7vw, 44px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin: 0 0 14px;
      color: #f5f5f7;
    }
    .black-band .lead {
      font-size: 16px;
      color: rgba(255,255,255,0.62);
      max-width: 420px;
      margin: 0 auto 28px;
      line-height: 1.5;
    }
    .black-band .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 980px;
      background: #f5f5f7;
      color: #0a0a0a;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }
    .black-band .cta:active { transform: scale(0.97); }
    .stage {
      position: relative;
      z-index: 2;
    }
    .sticker {
      position: absolute;
      z-index: 8;
      pointer-events: none;
      filter: drop-shadow(4px 6px 0 rgba(0,0,0,0.35));
    }
    .sticker svg { display: block; width: 100%; height: auto; overflow: visible; }
    /* loose placement, sitting on the tear — not pinned to corners */
    .st-sun { left: 6%; bottom: -28px; width: min(148px, 22vw); transform: rotate(-10deg); }
    .st-rain { right: 9%; bottom: -18px; width: min(156px, 24vw); transform: rotate(7deg); }
    .st-spark { right: 16%; top: 22%; width: min(72px, 10vw); transform: rotate(14deg); }

    .torn-edge {
      position: relative;
      z-index: 6;
      display: block;
      width: 100%;
      height: 56px;
      margin: 0;
      padding: 0;
      line-height: 0;
      pointer-events: none;
      background: transparent;
    }
    .torn-svg {
      display: block;
      width: 100%;
      height: 56px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.28));
    }

    .white-panel {
      position: relative;
      z-index: 1;
      background: #ffffff;
      margin-top: -36px;
      padding: 48px 24px 64px;
      flex: 1;
    }
    .white-panel-inner {
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
    }
    .white-panel h2 {
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1d1d1f;
      margin: 0 0 8px;
    }
    .white-panel p {
      color: #6e6e73;
      font-size: 15px;
      margin: 0;
    }

    .site-footer {
      background: #f5f5f7;
      color: #6e6e73;
      font-size: 13px;
      line-height: 1.5;
      padding: 48px 22px 28px;
      margin-top: auto;
      border-top: 1px solid #d2d2d7;
    }
    .site-footer-inner { max-width: 920px; margin: 0 auto; }
    .footer-brand-block {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 16px; padding-bottom: 28px;
      border-bottom: 1px solid #d2d2d7;
    }
    .footer-logo-lockup {
      display: flex; flex-direction: row; align-items: center;
      justify-content: center; gap: 10px;
    }
    .footer-logo-lockup .footer-icon {
      width: 28px; height: 28px; border-radius: 7px; display: block; flex-shrink: 0;
    }
    .footer-logo-lockup .footer-word {
      width: min(160px, 42vw); height: auto; display: block;
    }
    .footer-brand-block p {
      margin: 0; max-width: 420px; font-size: 13px; color: #6e6e73;
    }
    .footer-link-row {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 8px 20px; padding: 22px 0; border-bottom: 1px solid #d2d2d7;
    }
    .footer-link-row a {
      color: #1d1d1f; text-decoration: none; font-size: 13px; font-weight: 500;
    }
    .footer-link-row a:hover { color: #0066cc; }
    .footer-meta {
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
      gap: 10px 16px; padding-top: 18px; padding-bottom: 8px;
      font-size: 12px; color: #6e6e73; text-align: center;
    }
    .footer-meta a { color: #6e6e73; text-decoration: none; margin: 0 6px; }
    .footer-meta a:hover { color: #1d1d1f; text-decoration: underline; }
    @media (max-width: 560px) {
      .footer-meta { flex-direction: column; align-items: center; gap: 8px; }
      .footer-meta a { margin: 0 8px; }
      .black-band { min-height: 46vh; padding-bottom: 64px; }
      .torn-edge, .torn-svg { height: 48px; }
      .white-panel { margin-top: -30px; padding-top: 40px; }
      .st-sun { left: 2%; bottom: -20px; width: 108px; }
      .st-rain { right: 2%; bottom: -14px; width: 112px; }
      .st-spark { right: 18%; top: 18%; width: 48px; }
    }
  </style>
</head>
<body class="home">
  <header class="nav" id="topNav">
    <a class="brand" href="/">
      <img class="logo-img" data-logo="icon" width="52" height="52" alt="MapSky" />
      <img class="wordmark" src="assets/hero-mapsky-white.png" height="32" alt="MapSky" />
    </a>
    <button type="button" class="nav-toggle" id="navToggle" aria-label="開啟選單" aria-expanded="false">
      <span></span><span></span>
    </button>
    <div class="nav-right" id="navRight">
      <nav class="nav-links" aria-label="主選單">
        <a href="/features">畫面</a>
        <a href="/features">最新消息</a>
        <a href="/features">功能</a>
        <a href="/privacy">隱私與條款</a>
      </nav>
      <div class="nav-actions">
        <span data-auth-slot>
          <a class="btn btn-sm btn-primary" href="/login">登入</a>
        </span>
      </div>
    </div>
  </header>

  <main id="top">
    <div class="stage">
    <section class="black-band" aria-label="主視覺">
      <div class="sticker st-spark" aria-hidden="true">
        <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
          <path d="M40 4 L46 30 L72 22 L52 40 L76 52 L48 50 L58 76 L40 54 L22 76 L32 50 L4 52 L28 40 L8 22 L34 30 Z" fill="#ff3ad4" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="eyebrow">MapSky</p>
      <h1>天空、班次、停班停課。<br />一站看清楚。</h1>
      <p class="lead">整合氣象、捷運／台鐵／高鐵、YouBike 與停班停課，讓出門決策更簡單。</p>
      <a class="cta" href="/features">進一步了解 ›</a>
    </section>

    <div class="torn-edge" aria-hidden="true">
      <svg class="torn-svg" viewBox="0 0 1200 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,0 L1200,0 L1200,28 L1176,53 L1166,43 L1148,61 L1135,34 L1110,52 L1090,43 L1062,80 L1051,41 L1031,48 L1021,33 L1004,60 L986,41 L972,58 L952,43 L930,72 L917,39 L894,63 L884,44 L858,56 L842,37 L824,55 L811,44 L792,52 L781,38 L766,68 L751,41 L733,48 L716,40 L701,70 L690,40 L672,69 L653,35 L628,50 L618,42 L601,64 L590,35 L563,52 L547,36 L526,69 L514,37 L495,59 L475,36 L450,50 L431,42 L415,80 L402,34 L381,70 L367,42 L342,60 L322,37 L295,49 L282,32 L256,66 L240,36 L225,59 L206,43 L187,59 L167,39 L147,75 L135,36 L119,61 L101,40 L83,73 L64,38 L45,60 L33,40 L12,51 L2,33 L0,56 Z" fill="#0a0a0a"/>
      </svg>
    </div>
      <div class="sticker st-sun" aria-hidden="true">
        <svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#111" stroke-width="4" stroke-linejoin="round">
            <polygon points="70,6 78,42 112,18 88,50 134,50 96,70 134,90 88,90 112,122 78,98 70,134 62,98 28,122 52,90 6,90 44,70 6,50 52,50 28,18 62,42" fill="#ffe14a"/>
            <circle cx="70" cy="70" r="26" fill="#fff36a"/>
          </g>
        </svg>
      </div>
      <div class="sticker st-rain" aria-hidden="true">
        <svg viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#111" stroke-width="4" stroke-linejoin="round">
            <path d="M48 78c0-22 16-36 36-36 4-16 18-26 34-22 14 3 24 16 24 30 14 2 26 14 26 30 0 18-14 30-32 30H58c-16 0-28-12-28-28 0-2 0-3 0-4z" fill="#f4f7fb"/>
            <path d="M58 112 L50 132" fill="none" stroke="#2ad4ff" stroke-width="5" stroke-linecap="round"/>
            <path d="M82 114 L74 136" fill="none" stroke="#2ad4ff" stroke-width="5" stroke-linecap="round"/>
            <path d="M106 112 L98 130" fill="none" stroke="#2ad4ff" stroke-width="5" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
    </div>

    <section class="white-panel">
      <div class="white-panel-inner">
        <h2>最新消息</h2>
        <p>產品更新與公告將在此公布。</p>
      </div>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="site-footer-inner">
      <div class="footer-brand-block">
        <div class="footer-logo-lockup">
          <img class="footer-icon" src="assets/icon.png" width="28" height="28" alt="MapSky" />
          <img class="footer-word" src="assets/hero-mapsky%20.png" width="900" height="242" alt="MAPSKY" />
        </div>
        <p>天氣、班次、停班停課，一站看清楚。</p>
      </div>

      <nav class="footer-link-row" aria-label="頁尾連結">
        <a href="/features">功能</a>
        <a href="/features">畫面</a>
        <a href="/features">最新消息</a>
        <a href="/login">登入</a>
        <a href="/privacy">隱私與條款</a>
        <a href="mailto:mapskyapp@gmail.com">聯絡我們</a>
      </nav>

      <div class="footer-meta">
        <span>Copyright © MapSky</span>
        <span>
          <a href="/privacy">隱私權政策</a>
          <a href="/privacy">使用條款</a>
          <a href="mailto:mapskyapp@gmail.com">mapskyapp@gmail.com</a>
        </span>
      </div>
    </div>
  </footer>

  <script src="logo-icon.js"></script>
  <script src="logo-wordmark.js"></script>
  <script src="logo-apply.js"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      var toggle = document.getElementById("navToggle");
      var panel = document.getElementById("navRight");
      if (toggle && panel) {
        toggle.addEventListener("click", function () {
          var open = panel.classList.toggle("open");
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
          toggle.classList.toggle("open", open);
          document.body.classList.toggle("nav-open", open);
        });
        panel.querySelectorAll("a").forEach(function (a) {
          a.addEventListener("click", function () {
            panel.classList.remove("open");
            document.body.classList.remove("nav-open");
            toggle.classList.remove("open");
            toggle.setAttribute("aria-expanded", "false");
          });
        });
      }
    })();
  </script>
</body>
</html>
