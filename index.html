<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>MapSky</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <script>
  (async function () {
    try {
      var res = await fetch(
        'https://cdn.jsdelivr.net/gh/yonghong0333-ops/mapsky-web@ff94f146fd204f7b927a81f91c08f293c353c5c5/index.html',
        { cache: 'no-store' }
      );
      var html = await res.text();
      var doc = new DOMParser().parseFromString(html, 'text/html');

      Array.from(doc.head.children).forEach(function (node) {
        if (node.tagName === 'SCRIPT') return;
        if (node.tagName === 'TITLE') {
          document.title = node.textContent;
          return;
        }
        document.head.appendChild(document.importNode(node, true));
      });

      document.body.className = doc.body.className;
      document.body.innerHTML = doc.body.innerHTML;

      document.querySelectorAll('img[data-logo="icon"]').forEach(function (img) {
        if (!img.getAttribute('src')) img.src = 'assets/icon.png';
      });

      function setMenu(open) {
        var toggle = document.getElementById('navToggle');
        var nav = document.getElementById('topNav');
        var navRight = document.getElementById('navRight');
        document.body.classList.toggle('nav-open', !!open);
        if (nav) nav.classList.toggle('nav-open', !!open);
        if (toggle) {
          toggle.classList.toggle('open', !!open);
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        }
        if (navRight) navRight.classList.toggle('open', !!open);
      }

      var toggle = document.getElementById('navToggle');
      var navRight = document.getElementById('navRight');
      if (toggle) {
        toggle.addEventListener('click', function () {
          setMenu(!document.body.classList.contains('nav-open'));
        });
      }
      if (navRight) {
        navRight.querySelectorAll('a').forEach(function (a) {
          a.addEventListener('click', function () { setMenu(false); });
        });
      }

      // Full-bleed torn edges + full-screen black band + realistic mid tear
      var full = document.createElement('style');
      full.textContent = [
        '.torn-edge{position:relative!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;width:100vw!important;max-width:100vw!important;margin:0!important;height:64px!important;overflow:visible!important;z-index:6!important;}',
        '.torn-svg{width:100%!important;height:64px!important;display:block!important;}',
        '.block-news,.block-news.block,#features.block-news,.block{border-top:none!important;}',
        '.iphone-modal{position:relative!important;background:#000!important;color:#f5f5f7!important;border-radius:22px!important;border:1px solid rgba(10,132,255,.5)!important;box-shadow:0 24px 80px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.04)!important;padding:32px 28px 28px!important;width:min(100%,920px)!important;max-height:min(92vh,960px)!important;overflow:auto!important;transform:scale(.88) translateY(24px)!important;transition:transform .45s cubic-bezier(0.34,1.56,0.64,1)!important;scrollbar-width:none!important;-ms-overflow-style:none!important;}',
        '.iphone-modal::-webkit-scrollbar{display:none!important;}',
        '.iphone-modal ul{list-style:none!important;margin:0 0 8px!important;padding:0!important;display:flex!important;flex-direction:column!important;gap:10px!important;}',
        '.iphone-modal .model-panel ul{list-style:none!important;margin:0!important;padding:0!important;display:flex!important;flex-direction:column!important;gap:8px!important;}',
        '.iphone-modal .modal-models ul{list-style:none!important;margin:0!important;padding:0!important;display:flex!important;flex-direction:column!important;gap:6px!important;}',
        '.torn-mid{position:relative!important;left:50%!important;transform:translateX(-50%)!important;width:100vw!important;max-width:100vw!important;height:168px!important;margin:-8px 0 -14px!important;padding:0!important;line-height:0!important;pointer-events:none!important;background:transparent!important;overflow:visible!important;z-index:4!important;border:0!important;display:flex!important;align-items:center!important;justify-content:center!important;}',
        '.paper-tape{display:block!important;width:100vw!important;height:152px!important;object-fit:cover!important;object-position:center!important;mix-blend-mode:multiply!important;transform:none!important;pointer-events:none!important;filter:drop-shadow(0 10px 18px rgba(0,0,0,0.28)) drop-shadow(0 3px 6px rgba(0,0,0,0.16))!important;}',
        '@media (max-width:560px){.torn-edge,.torn-svg{height:52px!important;}.torn-mid{height:120px!important;}.paper-tape{width:100vw!important;height:108px!important;}.st-sun{width:96px!important;}.st-rain{width:100px!important;}.card-grid{grid-template-columns:1fr!important;}}'
      ].join('');
      document.head.appendChild(full);

      // Features → 適用裝置
      var features = document.getElementById('features');
      if (features) {
        features.innerHTML = [
          '<h2 id="features-title">適用裝置</h2>',
          '<p class="section-lead">在常用裝置上都能用 MapSky。</p>',
          '<ul class="card-grid features-grid">',
          '<li class="fcard fcard-iphone" role="button" tabindex="0" aria-label="查看 iPhone 適用機型">',
          '<div class="fcard-icon" aria-hidden="true"></div>',
          '<h3>iPhone</h3>',
          '<p>iOS App，完整天氣、班次與停班停課。</p>',
          '</li>',
          '<li class="fcard fcard-ipad">',
          '<div class="fcard-icon" aria-hidden="true"></div>',
          '<h3>iPad</h3>',
          '<p>大螢幕瀏覽，適合在家一次看清。</p>',
          '</li>',
          '<li class="fcard fcard-mac">',
          '<div class="fcard-icon" aria-hidden="true"></div>',
          '<h3>Mac</h3>',
          '<p>在 Mac 瀏覽器開啟，大畫面一次掌握。</p>',
          '</li>',
          '</ul>'
        ].join('');
      }

      if (features && !document.querySelector('.torn-mid')) {
        var div = document.createElement('div');
        div.className = 'torn-mid';
        div.setAttribute('aria-hidden', 'true');
        div.innerHTML = '<img class="paper-tape" src="assets/paper-tape.jpg" alt="" />';
        features.parentNode.insertBefore(div, features);
      }

      document.querySelectorAll('a[href="#features"]').forEach(function (a) {
        if (a.textContent.trim() === '功能') a.textContent = '適用裝置';
      });
    } catch (e) {
      document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">載入失敗，請重新整理。<br>' + e + '</p>';
      console.error(e);
    }
  })();
  </script>
</head>
<body style="margin:0;background:#0a0a0a;color:#f5f5f7;font-family:-apple-system,sans-serif">
  <p style="padding:24px;color:#6e6e73">載入 MapSky…</p>
</body>
</html>
