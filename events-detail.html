<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>活動介紹 — MapSky</title>
  <meta name="theme-color" content="#07070a" />
  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <script src="/page-transition.js"></script>
  <style>
    :root { --blue:#0A84FF; --violet:#5e5ce6; --pink:#bf5af2; --cyan:#64d2ff; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    html,body { margin:0; background:#07070a; color:#f5f5f7; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"PingFang TC","Noto Sans TC",sans-serif; -webkit-font-smoothing:antialiased; }
    .wrap { max-width:520px; margin:0 auto; padding:0 22px; position:relative; z-index:1; }
    .topbar { position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; gap:12px; padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px; }
    .back-btn { width:38px; height:38px; border:0; border-radius:50%; background:rgba(30,30,36,0.8); color:#fff; font-size:18px; cursor:pointer; }
    .topbar-title { font-size:15px; font-weight:600; opacity:0; transition:opacity .3s; padding:7px 14px; border-radius:980px; background:rgba(30,30,36,0.8); }
    .topbar.scrolled .topbar-title { opacity:1; }

    /* 1 Hero */
    .hero { position:relative; overflow:hidden; text-align:center; padding:calc(88px + env(safe-area-inset-top,0px)) 0 70px; background:radial-gradient(120% 80% at 50% 0%, #1b1f4a 0%, #0b0b1a 55%, #07070a 100%); }
    .blob { position:absolute; border-radius:50%; will-change:transform; animation:float 16s ease-in-out infinite; }
    .b1 { width:420px; height:420px; background:radial-gradient(circle,rgba(10,132,255,.55),rgba(10,132,255,0) 68%); top:-140px; left:-170px; }
    .b2 { width:400px; height:400px; background:radial-gradient(circle,rgba(191,90,242,.5),rgba(191,90,242,0) 68%); top:160px; right:-190px; animation-delay:-5s; }
    .b3 { width:360px; height:360px; background:radial-gradient(circle,rgba(100,210,255,.3),rgba(100,210,255,0) 68%); bottom:-150px; left:10%; animation-delay:-9s; }
    @keyframes float { 0%,100% { transform:translate3d(0,0,0); } 50% { transform:translate3d(20px,-24px,0); } }
    .badge { display:inline-block; font-size:13px; font-weight:650; letter-spacing:.06em; color:var(--cyan); background:rgba(100,210,255,.12); border:1px solid rgba(100,210,255,.3); padding:6px 14px; border-radius:980px; margin-bottom:18px; }
    h1 { font-size:clamp(38px,11vw,54px); line-height:1.08; font-weight:800; letter-spacing:-.02em; margin:0 0 14px; background:linear-gradient(180deg,#fff 30%,#b9c4ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .tagline { font-size:17px; line-height:1.55; color:rgba(255,255,255,.72); margin:0 auto 22px; max-width:380px; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:30px; }
    .chip { font-size:13px; padding:7px 13px; border-radius:980px; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14); }
    .cover-stage { margin-top:6px; }
    .cover { display:block; width:100%; border-radius:22px; transform:rotate(-1.5deg); box-shadow:0 24px 48px -16px rgba(94,92,230,.6), 0 0 0 1px rgba(255,255,255,.12); background:#16161a; }

    /* 2 Highlights (light) */
    .light { background:linear-gradient(180deg,#f5f5f7,#e9ecff); color:#1d1d1f; padding:64px 0; }
    .eyebrow { font-size:13px; font-weight:700; letter-spacing:.1em; color:var(--violet); text-transform:uppercase; margin:0 0 8px; }
    h2 { font-size:clamp(28px,8vw,36px); line-height:1.15; font-weight:800; letter-spacing:-.015em; margin:0 0 22px; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .stat { background:#fff; border-radius:22px; padding:20px 18px; box-shadow:0 6px 18px -10px rgba(60,60,140,.25); }
    .stat.wide { grid-column:1 / -1; background:linear-gradient(135deg,#0A84FF,#5e5ce6); color:#fff; }
    .stat .big { font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1.1; }
    .stat .lbl { font-size:13px; opacity:.65; margin-top:6px; }

    /* 3 Sessions (gradient) */
    .sessions { background:linear-gradient(160deg,#0f2a6b 0%,#3b2a8c 55%,#7a2fa8 100%); padding:64px 0; position:relative; overflow:hidden; }
    .sessions::before { content:""; position:absolute; width:320px; height:320px; right:-120px; top:-80px; background:radial-gradient(circle,rgba(100,210,255,.35),transparent 70%); }
    .sessions .eyebrow { color:var(--cyan); }
    .scard { position:relative; display:flex; gap:16px; align-items:stretch; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.18); border-radius:24px; padding:18px; margin-bottom:14px; }
    .date { flex:0 0 78px; text-align:center; border-radius:18px; background:rgba(255,255,255,.95); color:#1d1d1f; padding:10px 0 8px; }
    .date .m { font-size:12px; font-weight:700; color:#ff375f; }
    .date .d { font-size:34px; font-weight:800; line-height:1.05; }
    .date .w { font-size:12px; color:#6e6e73; }
    .sinfo { flex:1; min-width:0; }
    .sname { font-size:18px; font-weight:750; margin:0 0 4px; }
    .smeta { font-size:14px; color:rgba(255,255,255,.75); line-height:1.5; }
    .subj { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .subj span { font-size:12px; padding:4px 10px; border-radius:980px; background:rgba(255,255,255,.16); }

    /* 日程表 + 頭目（1 天 1 區） */
    .schedule { background:linear-gradient(165deg,#0a0a12 0%,#1a1030 45%,#2a1848 100%); padding:64px 0; position:relative; overflow:hidden; }
    .schedule::before { content:""; position:absolute; width:280px; height:280px; left:-80px; bottom:-60px; background:radial-gradient(circle,rgba(191,90,242,.28),transparent 70%); pointer-events:none; }
    .schedule .eyebrow { color:#e0aaff; }
    .day-block { margin-bottom:22px; border-radius:22px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); overflow:hidden; }
    .day-head { display:flex; align-items:center; gap:12px; padding:14px 16px; background:rgba(255,255,255,.08); border-bottom:1px solid rgba(255,255,255,.1); }
    .day-head .dh-date { font-size:17px; font-weight:750; letter-spacing:-.01em; }
    .day-head .dh-count { font-size:12px; padding:4px 10px; border-radius:980px; background:rgba(191,90,242,.25); color:#e0aaff; font-weight:600; }
    .slot-row { display:flex; gap:12px; align-items:center; padding:14px 16px; border-bottom:1px solid rgba(255,255,255,.06); }
    .slot-row:last-child { border-bottom:0; }
    .slot-boss { flex:0 0 52px; width:52px; height:52px; border-radius:14px; display:grid; place-items:center; font-size:22px; background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04)); border:1px solid rgba(255,255,255,.14); overflow:hidden; }
    .slot-boss img { width:100%; height:100%; object-fit:contain; }
    .slot-body { flex:1; min-width:0; }
    .slot-name { font-size:16px; font-weight:700; margin:0 0 3px; }
    .slot-meta { font-size:13px; color:rgba(255,255,255,.65); line-height:1.45; }
    .slot-boss-name { font-size:12px; color:#c9a0ff; margin-top:4px; font-weight:600; }
    .slot-time { flex:0 0 auto; text-align:right; font-size:13px; font-weight:650; color:rgba(255,255,255,.85); white-space:nowrap; }

    /* 4 Steps (white) */
    .steps { background:#fff; color:#1d1d1f; padding:64px 0; }
    .step { display:flex; gap:16px; align-items:flex-start; padding:16px 0; border-bottom:1px solid #ececf0; }
    .step:last-child { border-bottom:0; }
    .num { flex:0 0 44px; height:44px; border-radius:14px; display:grid; place-items:center; font-weight:800; font-size:18px; color:#fff; background:linear-gradient(135deg,#0A84FF,#bf5af2); }
    .step h3 { margin:2px 0 4px; font-size:17px; }
    .step p { margin:0; font-size:14px; color:#6e6e73; line-height:1.5; }

    /* 5 Notes (warm) */
    .notes { background:linear-gradient(160deg,#2a1a0a,#4a2a14 60%,#6b3a1a); padding:64px 0; }
    .notes .eyebrow { color:#ffb45e; }
    .note-card { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:22px; padding:20px; margin-bottom:12px; }
    .note-card h3 { margin:0 0 8px; font-size:15px; color:#ffcf99; }
    .note-card p { margin:0; font-size:15px; line-height:1.7; white-space:pre-wrap; color:rgba(255,255,255,.88); }


    /* ---- rich text / product-article blocks ---- */
    .lead-date { font-size:clamp(20px,6vw,26px); font-weight:800; line-height:1.4; margin:0 0 18px; color:#fff; }
    .intro-text { text-align:left; margin:0 0 24px; }
    .intro-text p { margin:0 0 14px; font-size:16px; line-height:1.85; color:rgba(255,255,255,.82); }
    .ticket { position:relative; text-align:left; border-radius:26px; padding:2px; background:linear-gradient(135deg,#64d2ff,#5e5ce6 55%,#bf5af2); margin:8px 0 30px; }
    .ticket-in { border-radius:24px; background:linear-gradient(180deg,#14163a,#0d0e24); padding:22px 20px 20px; text-align:center; }
    .ticket .tk-label { font-size:13px; font-weight:700; letter-spacing:.12em; color:var(--cyan); }
    .ticket .tk-price { font-size:40px; font-weight:850; margin:6px 0 14px; letter-spacing:-.02em; }
    .tk-rows { text-align:left; border-top:1px solid rgba(255,255,255,.12); padding-top:6px; margin-bottom:18px; }
    .tk-row { display:flex; justify-content:space-between; gap:14px; padding:9px 0; font-size:14px; border-bottom:1px solid rgba(255,255,255,.07); }
    .tk-row:last-child { border-bottom:0; }
    .tk-row span:first-child { color:rgba(255,255,255,.55); flex:0 0 auto; }
    .tk-row span:last-child { text-align:right; font-weight:600; }
    .btn-inline { width:100%; display:flex; align-items:center; justify-content:center; padding:15px 18px; border-radius:980px; border:0; font-size:16px; font-weight:700; font-family:inherit; color:#fff; cursor:pointer; background:linear-gradient(135deg,#0A84FF,#5e5ce6,#bf5af2); }
    .btn-inline:disabled { opacity:.6; background:#3a3a3c; cursor:not-allowed; }

    .article { background:linear-gradient(180deg,#f5f5f7,#eceefc); color:#1d1d1f; padding:64px 0 56px; }
    .article h2 { background:linear-gradient(90deg,#0A84FF,#bf5af2); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .article h3 { font-size:20px; margin:30px 0 10px; letter-spacing:-.01em; }
    .article p { margin:0 0 16px; font-size:16px; line-height:1.9; color:#3a3a3c; white-space:pre-wrap; }
    .article .pull { margin:22px 0; padding:18px 20px; border-radius:20px; background:#fff; border-left:5px solid #5e5ce6; font-size:16px; line-height:1.75; font-weight:600; color:#1d1d1f; box-shadow:0 6px 18px -10px rgba(60,60,140,.3); }

    .perks { background:linear-gradient(165deg,#062f3a 0%,#0b4a5c 50%,#14336b 100%); padding:64px 0; }
    .perks .eyebrow { color:#7ff0d0; }
    .perk { display:flex; gap:14px; align-items:flex-start; padding:16px; margin-bottom:12px; border-radius:20px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); }
    .perk .ic { flex:0 0 48px; height:48px; border-radius:15px; display:grid; place-items:center; font-size:24px; background:linear-gradient(135deg,rgba(127,240,208,.35),rgba(100,210,255,.25)); }
    .perk h3 { margin:2px 0 4px; font-size:17px; }
    .perk p { margin:0; font-size:14px; line-height:1.65; color:rgba(255,255,255,.75); }

    .faq { background:linear-gradient(180deg,#0b0b1a,#12123a); padding:64px 0; }
