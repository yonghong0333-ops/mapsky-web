<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>登入 — MapSky</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">
      <img class="logo-img" data-logo="icon" width="36" height="36" alt="MapSky" />
      <img class="wordmark" data-logo="wordmark" height="22" alt="MapSky" />
    </a>
    <a class="btn btn-sm btn-ghost" href="/">回首頁</a>
  </header>

  <div class="login-wrap">
    <div class="login-card" id="loginCard">
      <div class="login-brand">
        <img class="logo-img" data-logo="icon" width="44" height="44" alt="" />
        <div>
          <h1>登入 MapSky</h1>
          <p class="login-sub" style="margin:0">與 App 同一套帳號</p>
        </div>
      </div>

      <div id="guestPanel">
        <p class="login-sub">選擇登入方式。第三方會短暫跳到驗證頁，完成後回到本站。</p>
        <div class="provider-list" id="providerList">
          <a class="provider-btn" href="https://mapskyapp.vercel.app/api/auth/login?provider=google&return_to=https%3A%2F%2Fmapskyweb.vercel.app%2Flogin">
            <img class="provider-icon" src="https://mapskyapp.vercel.app/login-icons/google.png" alt="" width="22" height="22" />
            <span>使用 Google 登入</span>
          </a>
          <a class="provider-btn" href="https://mapskyapp.vercel.app/api/auth/login?provider=github&return_to=https%3A%2F%2Fmapskyweb.vercel.app%2Flogin">
            <img class="provider-icon" src="https://mapskyapp.vercel.app/login-icons/github.png" alt="" width="22" height="22" />
            <span>使用 GitHub 登入</span>
          </a>
        </div>
        <div class="divider">或 Email 驗證碼</div>
        <div class="magic-row">
          <input id="emailInput" type="email" placeholder="your@email.com" autocomplete="email" />
          <button type="button" id="sendBtn">寄送</button>
        </div>
        <p class="hint">會寄 6 位數驗證碼（與 MapSky App 相同帳號）。</p>
        <div class="otp-box" id="otpBox">
          <div class="magic-row" style="margin-top:10px">
            <input id="codeInput" type="text" inputmode="numeric" maxlength="6" placeholder="6 位數驗證碼" autocomplete="one-time-code" />
            <button type="button" id="verifyBtn">驗證</button>
          </div>
        </div>
        <div class="msg" id="msg"></div>
      </div>

      <div class="account-panel" id="accountPanel">
        <p id="accountText">你已登入。</p>
        <div class="account-actions">
          <a class="btn btn-primary" href="/">回首頁</a>
          <button type="button" class="btn btn-ghost" id="logoutBtn">登出</button>
        </div>
      </div>
    </div>
  </div>

  <script src="logo-icon.js"></script>
  <script src="logo-wordmark.js"></script>
  <script src="logo-apply.js"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      var msg = document.getElementById("msg");
      var otpBox = document.getElementById("otpBox");
      var guestPanel = document.getElementById("guestPanel");
      var accountPanel = document.getElementById("accountPanel");
      var providerList = document.getElementById("providerList");
      var pendingEmail = "";
      var iconBase = "https://mapskyapp.vercel.app/login-icons/";

      function showMsg(text, ok) {
        msg.textContent = text;
        msg.className = "msg show " + (ok ? "ok" : "err");
      }

      function renderLoggedIn(s) {
        guestPanel.style.display = "none";
        accountPanel.classList.add("show");
        document.getElementById("accountText").textContent =
          "目前登入：" + (MapSkyAuth.displayName(s) || "帳號");
      }

      function renderGuest() {
        guestPanel.style.display = "block";
        accountPanel.classList.remove("show");
      }

      function providerIcon(id) {
        if (id === "x") return iconBase + "x.svg";
        return iconBase + id + ".png";
      }

      window.MapSkyAuthOnSession = function (body) {
        if (body && body.loggedIn) renderLoggedIn(body);
        else renderGuest();
      };

      MapSkyAuth.session().then(function (res) {
        if (res.body && res.body.loggedIn) renderLoggedIn(res.body);
        else renderGuest();
      }).catch(function () { renderGuest(); });

      MapSkyAuth.providers().then(function (res) {
        var list = (res.body && res.body.providers) || [];
        var configured = list.filter(function (p) { return p.configured; });
        if (!configured.length) return;
        providerList.innerHTML = configured.map(function (p) {
          return (
            '<a class="provider-btn" href="' + MapSkyAuth.oauthUrl(p.id) + '">' +
              '<img class="provider-icon" src="' + providerIcon(p.id) + '" alt="" width="22" height="22" />' +
              '<span>使用 ' + p.label + ' 登入</span>' +
            '</a>'
          );
        }).join("");
      }).catch(function () {});

      document.getElementById("sendBtn").addEventListener("click", function () {
        var email = document.getElementById("emailInput").value.trim();
        if (!email) return showMsg("請輸入 Email", false);
        pendingEmail = email;
        document.getElementById("sendBtn").disabled = true;
        MapSkyAuth.sendMagicLink(email).then(function (res) {
          document.getElementById("sendBtn").disabled = false;
          if (res.body && res.body.ok) {
            otpBox.classList.add("show");
            showMsg("驗證碼已寄出，請到信箱查看。", true);
          } else {
            var reason = (res.body && res.body.reason) || "send-failed";
            var map = {
              "invalid-email": "Email 格式不正確",
              "too-soon": "請稍候再試（約 30 秒）",
              "otp-unavailable": "驗證服務暫時無法使用",
              "send-failed": "寄信失敗，請稍後再試"
            };
            showMsg(map[reason] || ("寄送失敗：" + reason), false);
          }
        }).catch(function () {
          document.getElementById("sendBtn").disabled = false;
          showMsg("網路錯誤，請稍後再試", false);
        });
      });

      document.getElementById("verifyBtn").addEventListener("click", function () {
        var code = document.getElementById("codeInput").value.trim();
        if (!pendingEmail) pendingEmail = document.getElementById("emailInput").value.trim();
        if (!pendingEmail || !code) return showMsg("請輸入 Email 與驗證碼", false);
        document.getElementById("verifyBtn").disabled = true;
        MapSkyAuth.verifyCode(pendingEmail, code).then(function (res) {
          document.getElementById("verifyBtn").disabled = false;
          if (res.body && res.body.ok) {
            showMsg("登入成功", true);
            return MapSkyAuth.session().then(function (s) {
              if (s.body && s.body.loggedIn) {
                renderLoggedIn(s.body);
                MapSkyAuth.updateNav(s.body);
              }
            });
          }
          var reason = (res.body && res.body.reason) || "wrong-code";
          var map = {
            "wrong-code": "驗證碼錯誤",
            "too-many-attempts": "嘗試次數過多，請重新寄送",
            "invalid-code": "請輸入 6 位數字",
            "invalid-email": "Email 格式不正確"
          };
          showMsg(map[reason] || ("驗證失敗：" + reason), false);
        }).catch(function () {
          document.getElementById("verifyBtn").disabled = false;
          showMsg("網路錯誤，請稍後再試", false);
        });
      });

      document.getElementById("logoutBtn").addEventListener("click", function () {
        MapSkyAuth.logout().then(function () {
          MapSkyAuth.updateNav({ loggedIn: false });
          renderGuest();
          showMsg("已登出", true);
        });
      });
    })();
  </script>
</body>
</html>
