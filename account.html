<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>帳號設定 — MapSky</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.account-page {
      min-height: 100vh; min-height: 100dvh;
      background: #ffffff;
      color: #1d1d1f;
    }
    body.account-page .nav {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    body.account-page .brand { color: #1d1d1f; }
    body.account-page .nav-links a { color: #1d1d1f !important; }
    body.account-page .nav-toggle span { background: #1d1d1f; }
    body.account-page .nav .btn-ghost {
      background: transparent !important;
      color: #1d1d1f !important;
      border: 2px solid rgba(0,0,0,0.2) !important;
    }
    body.account-page .nav .btn-primary {
      background: #1d1d1f !important;
      color: #fff !important;
      border: 0 !important;
    }
    @media (max-width: 768px) {
      body.account-page.nav-open .nav-right,
      body.account-page .nav-right.open { background: #ffffff !important; }
      body.account-page.nav-open .nav-links a { color: #1d1d1f !important; }
    }

    .account-stage {
      max-width: 640px;
      margin: 0 auto;
      padding: calc(var(--nav-h, 52px) + env(safe-area-inset-top, 0px) + 32px) 20px 80px;
    }
    .account-stage h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
      color: #1d1d1f;
      text-align: center;
    }
    .account-stage .sub {
      color: #6e6e73;
      font-size: 14px;
      margin: 0 0 28px;
      text-align: center;
    }

    /* radial layout around avatar */
    .orbit {
      position: relative;
      width: min(100%, 360px);
      height: 360px;
      margin: 0 auto 36px;
    }
    .orbit-avatar {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 112px; height: 112px;
      border-radius: 50%;
      overflow: hidden;
      background: #f0f0f2;
      border: 3px solid #fff;
      box-shadow:
        0 4px 16px rgba(0,0,0,0.12),
        0 12px 32px rgba(0,0,0,0.08);
      display: flex; align-items: center; justify-content: center;
      z-index: 2;
    }
    .orbit-avatar img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .orbit-avatar .initials {
      font-size: 36px;
      font-weight: 700;
      color: #1d1d1f;
      letter-spacing: -0.02em;
      user-select: none;
    }

    /* soft guide rings */
    .orbit-ring {
      position: absolute;
      left: 50%; top: 50%;
      border: 1px dashed rgba(0,0,0,0.08);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    .orbit-ring.r1 { width: 200px; height: 200px; }
    .orbit-ring.r2 { width: 300px; height: 300px; }

    .orbit-chip {
      position: absolute;
      max-width: 140px;
      padding: 10px 14px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      text-align: center;
      z-index: 1;
      animation: chipIn 0.55s cubic-bezier(0.34, 1.3, 0.64, 1) both;
    }
    .orbit-chip .chip-label {
      font-size: 11px;
      font-weight: 600;
      color: #8e8e93;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .orbit-chip .chip-value {
      font-size: 14px;
      font-weight: 650;
      color: #1d1d1f;
      word-break: break-word;
      line-height: 1.3;
    }

    /* positions around avatar */
    .chip-name  { left: 50%; top: 8%;  transform: translateX(-50%); animation-delay: 0.05s; }
    .chip-email { right: 0;   top: 38%; transform: translateY(-50%); animation-delay: 0.12s; max-width: 150px; }
    .chip-prov  { left: 50%; bottom: 8%; transform: translateX(-50%); animation-delay: 0.18s; }
    .chip-id    { left: 0;   top: 38%; transform: translateY(-50%); animation-delay: 0.24s; }

    @keyframes chipIn {
      from { opacity: 0; transform: translate(-50%, 12px) scale(0.92); }
      to   { opacity: 1; }
    }
    .chip-email { animation-name: chipInR; }
    .chip-id    { animation-name: chipInL; }
    .chip-prov  { animation-name: chipInB; }
    @keyframes chipInR {
      from { opacity: 0; transform: translate(12px, -50%) scale(0.92); }
      to   { opacity: 1; transform: translateY(-50%); }
    }
    @keyframes chipInL {
      from { opacity: 0; transform: translate(-12px, -50%) scale(0.92); }
      to   { opacity: 1; transform: translateY(-50%); }
    }
    @keyframes chipInB {
      from { opacity: 0; transform: translate(-50%, 12px) scale(0.92); }
      to   { opacity: 1; transform: translateX(-50%); }
    }

    @media (max-width: 400px) {
      .orbit { width: 300px; height: 320px; }
      .orbit-avatar { width: 96px; height: 96px; }
      .orbit-avatar .initials { font-size: 30px; }
      .orbit-ring.r1 { width: 170px; height: 170px; }
      .orbit-ring.r2 { width: 250px; height: 250px; }
      .orbit-chip { max-width: 120px; padding: 8px 11px; }
      .orbit-chip .chip-value { font-size: 13px; }
    }

    .account-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 8px;
    }
    .account-actions .btn {
      border-radius: 980px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: 0;
      font-family: inherit;
    }
    .account-actions .btn-primary {
      background: #1d1d1f;
      color: #fff;
    }
    .account-actions .btn-danger {
      background: transparent;
      color: #ff3b30;
      border: 2px solid rgba(255,59,48,0.35);
    }
    .guest-box {
      text-align: center;
      padding: 48px 24px;
      color: #6e6e73;
    }
    .guest-box a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 28px;
      border-radius: 980px;
      background: #1d1d1f;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body class="account-page">
  <header class="nav" id="topNav">
    <a class="brand" href="/">
      <img class="logo-img" data-logo="icon" width="36" height="36" alt="MapSky" />
      <img class="wordmark" data-logo="wordmark" height="22" alt="MapSky" />
    </a>
    <button type="button" class="nav-toggle" id="navToggle" aria-label="開啟選單" aria-expanded="false">
      <span></span><span></span>
    </button>
    <div class="nav-right" id="navRight">
      <nav class="nav-links" aria-label="主選單">
        <a href="/#news">最新消息</a>
        <a href="/#features">適用裝置</a>
        <a href="/privacy">隱私與條款</a>
      </nav>
      <div class="nav-actions">
        <span data-auth-slot>
          <a class="btn btn-sm btn-primary" href="/login">登入</a>
        </span>
      </div>
    </div>
  </header>

  <main class="account-stage">
    <h1>帳號設定</h1>
    <p class="sub">管理你的 MapSky 帳號</p>

    <div id="loggedInView" style="display:none">
      <div class="orbit" id="orbit">
        <div class="orbit-ring r1" aria-hidden="true"></div>
        <div class="orbit-ring r2" aria-hidden="true"></div>

        <div class="orbit-avatar" id="avatarBox">
          <span class="initials" id="avatarInitials">?</span>
          <img id="avatarImg" alt="" style="display:none" />
        </div>

        <div class="orbit-chip chip-name">
          <div class="chip-label">暱稱</div>
          <div class="chip-value" id="nameVal">—</div>
        </div>
        <div class="orbit-chip chip-email">
          <div class="chip-label">Email</div>
          <div class="chip-value" id="emailVal">—</div>
        </div>
        <div class="orbit-chip chip-prov">
          <div class="chip-label">登入方式</div>
          <div class="chip-value" id="providerVal">—</div>
        </div>
        <div class="orbit-chip chip-id">
          <div class="chip-label">帳號</div>
          <div class="chip-value" id="idVal">MapSky</div>
        </div>
      </div>

      <div class="account-actions">
        <a class="btn btn-primary" href="/">回首頁</a>
        <button type="button" class="btn btn-danger" id="logoutBtn">登出</button>
      </div>
    </div>

    <div class="guest-box" id="guestView">
      <p>你尚未登入</p>
      <a href="/login">前往登入</a>
    </div>
  </main>

  <script src="logo-icon.js"></script>
  <script src="logo-wordmark.js"></script>
  <script src="logo-apply.js"></script>
  <script src="auth.js"></script>
  <script src="nav-scroll.js?v=22"></script>
  <script>
    (function () {
      var toggle = document.getElementById('navToggle');
      var panel = document.getElementById('navRight');
      if (toggle && panel) {
        toggle.addEventListener('click', function () {
          var open = panel.classList.toggle('open');
          toggle.classList.toggle('open', open);
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          document.body.classList.toggle('nav-open', open);
        });
        panel.querySelectorAll('a').forEach(function (a) {
          a.addEventListener('click', function () {
            panel.classList.remove('open');
            toggle.classList.remove('open');
            document.body.classList.remove('nav-open');
            toggle.setAttribute('aria-expanded', 'false');
          });
        });
      }

      function initialsFrom(name) {
        if (!name) return '?';
        var s = String(name).trim();
        if (!s) return '?';
        // CJK: take first char; Latin: up to 2 initials
        if (/[\u4e00-\u9fff]/.test(s)) return s.slice(0, 1);
        var parts = s.split(/\s+/).filter(Boolean);
        if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
        return s.slice(0, 2).toUpperCase();
      }

      function fill(s) {
        var logged = s && s.loggedIn;
        document.getElementById('loggedInView').style.display = logged ? 'block' : 'none';
        document.getElementById('guestView').style.display = logged ? 'none' : 'block';
        if (!logged) return;

        var p = s.profile || {};
        var name = p.nickname || p.name || '—';
        var email = p.email || '—';
        var provider = p.provider || p.authProvider || 'OAuth / Email';
        var avatarUrl = p.picture || p.avatar || p.image || p.photo || '';

        document.getElementById('nameVal').textContent = name;
        document.getElementById('emailVal').textContent = email;
        document.getElementById('providerVal').textContent = provider;
        document.getElementById('idVal').textContent =
          (p.id || p.sub || email !== '—' ? String(p.id || p.sub || email).slice(0, 12) : 'MapSky');

        var img = document.getElementById('avatarImg');
        var initials = document.getElementById('avatarInitials');
        if (avatarUrl) {
          img.onload = function () {
            img.style.display = 'block';
            initials.style.display = 'none';
          };
          img.onerror = function () {
            img.style.display = 'none';
            initials.style.display = 'block';
            initials.textContent = initialsFrom(name);
          };
          img.src = avatarUrl;
          img.alt = name;
        } else {
          img.style.display = 'none';
          initials.style.display = 'block';
          initials.textContent = initialsFrom(name);
        }
      }

      window.MapSkyAuthOnSession = fill;

      if (window.MapSkyAuth && window.MapSkyAuth.session) {
        window.MapSkyAuth.session().then(function (res) {
          fill(res.body);
        }).catch(function () {
          fill({ loggedIn: false });
        });
      }

      var logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', function () {
          if (!window.MapSkyAuth) return;
          logoutBtn.disabled = true;
          logoutBtn.textContent = '登出中…';
          window.MapSkyAuth.logout().then(function () {
            location.href = '/';
          }).catch(function () {
            logoutBtn.disabled = false;
            logoutBtn.textContent = '登出';
          });
        });
      }
    })();
  </script>
</body>
</html>
