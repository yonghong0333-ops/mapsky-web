<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>購買入場券 — MapSky</title>
  <meta name="theme-color" content="#f6f4ee" />
  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <style>
    :root { --bg:#f6f4ee; --text:#1d1d1f; --dim:rgba(60,60,67,.62); --blue:#0A84FF; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px; background:rgba(246,244,238,.9); border-bottom:1px solid rgba(0,0,0,.08); }
    .back-btn { width:36px; height:36px; border:0; border-radius:50%; background:rgba(0,0,0,.07); color:#1d1d1f; font-size:18px; cursor:pointer; }
    .topbar-title { flex:1; font-size:16px; font-weight:600; }
    .stage { max-width:480px; margin:0 auto; padding:20px 20px calc(100px + env(safe-area-inset-bottom,0px)); }
    .lead { color:var(--dim); font-size:15px; line-height:1.5; }
    h1 { font-size:28px; margin:8px 0 16px; }
    .option { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid rgba(0,0,0,.09); border-radius:18px; padding:16px; margin:0 0 12px; color:var(--text); font-family:inherit; cursor:pointer; box-shadow:0 6px 16px -10px rgba(40,60,120,.28); }
    .option.selected { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue); background:#eef4ff; }
    .option .name { font-size:16px; font-weight:650; margin:0 0 4px; }
    .option .meta { font-size:13px; color:var(--dim); }
    .option .price { margin-top:10px; font-size:16px; font-weight:700; color:#0a6cff; }
    .footer-bar { position:fixed; left:0; right:0; bottom:0; padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px)); background:linear-gradient(180deg,rgba(246,244,238,0),rgba(246,244,238,.94) 45%); }
    .btn { width:100%; max-width:480px; margin:0 auto; display:flex; align-items:center; justify-content:center; padding:14px 18px; border-radius:980px; border:0; font-size:16px; font-weight:650; font-family:inherit; cursor:pointer; color:#fff; background:linear-gradient(135deg,#0A84FF,#5e5ce6,#bf5af2); }
    .btn:disabled { opacity:.45; cursor:not-allowed; background:#d6d6db; color:#8e8e93; }
    .empty { color:var(--dim); padding:24px 0; }
    .pay-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(0,0,0,.08); font-size:14px; }
    .pay-overlay { position:fixed; inset:0; z-index:9999; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(246,244,238,.92); text-align:center; padding:24px; }
    .pay-overlay.show { display:flex; }
    .pay-spinner { width:64px; height:64px; border-radius:50%; border:4px solid rgba(0,0,0,.1); border-top-color:#30d158; animation:spin .9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .pay-text { font-size:17px; font-weight:700; }
    .pay-sub { font-size:13px; color:var(--dim); }
  </style>
  <script src="/page-transition.js"></script>
</head>
<body>
  <header class="topbar">
    <button type="button" class="back-btn" id="backBtn" aria-label="返回">‹</button>
    <div class="topbar-title" id="topTitle">購買入場券</div>
  </header>
  <div class="stage" id="screenMain">
    <h1 id="title">載入中…</h1>
    <p class="lead" id="lead"></p>
    <div id="sessionList"></div>
    <div id="packageList"></div>
    <div id="payBox" style="display:none">
      <div id="orderSummary"></div>
      <p class="lead">模擬付款（測試）</p>
    </div>
    <div id="doneBox" class="empty" style="display:none">購票完成，資格已綁定帳號。</div>
  </div>
  <div class="footer-bar"><button type="button" class="btn" id="nextBtn" disabled>下一步</button></div>
  <div class="pay-overlay" id="payOverlay" role="status" aria-live="polite">
    <div class="pay-spinner"></div>
    <div class="pay-text">安全交易處理中…</div>
    <div class="pay-sub">請勿關閉或重新整理頁面</div>
  </div>
  <script src="/auth.js"></script>
  <script src="/events-buy-core.js"></script>
</body>
</html>
