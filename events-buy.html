<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>購買入場券 — MapSky</title>
  <meta name="theme-color" content="#f6f4ee" />
  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <style>
    :root { --bg:#f6f4ee; --text:#1d1d1f; --dim:rgba(60,60,67,.62); --blue:#0A84FF; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px; background:rgba(246,244,238,.9); border-bottom:1px solid rgba(0,0,0,.08); }
    .back-btn { width:36px; height:36px; border:0; border-radius:50%; background:rgba(0,0,0,.07); color:#1d1d1f; font-size:18px; cursor:pointer; }
    .topbar-title { flex:1; font-size:16px; font-weight:600; }
    .stage { max-width:480px; margin:0 auto; padding:20px 20px calc(100px + env(safe-area-inset-bottom,0px)); }
    .lead { color:var(--dim); font-size:15px; }
    h1 { font-size:28px; margin:8px 0 16px; }
    .option { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid rgba(0,0,0,.09); border-radius:18px; padding:16px; margin:0 0 12px; color:var(--text); font-family:inherit; cursor:pointer; box-shadow:0 6px 16px -10px rgba(40,60,120,.28); }
    .option.selected { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue); background:#eef4ff; }
    .option .name { font-size:16px; font-weight:650; margin:0 0 4px; }
    .option .meta { font-size:13px; color:var(--dim); }
    .option .price { margin-top:10px; font-size:16px; font-weight:700; color:#0a6cff; }
    .footer-bar { position:fixed; left:0; right:0; bottom:0; padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px)); background:linear-gradient(180deg,rgba(246,244,238,0),rgba(246,244,238,.94) 45%); }
    .btn { width:100%; max-width:480px; margin:0 auto; display:flex; align-items:center; justify-content:center; padding:14px 18px; border-radius:980px; border:0; font-size:16px; font-weight:650; font-family:inherit; cursor:pointer; color:#fff; background:linear-gradient(135deg,#0A84FF,#5e5ce6,#bf5af2); }
    .btn:disabled { opacity:.45; cursor:not-allowed; background:#d6d6db; color:#8e8e93; }
    .empty { color:var(--dim); padding:24px 0; }
    .pay-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(0,0,0,.08); font-size:14px; }
  </style>
  <script src="/page-transition.js"></script>
</head>
<body>
  <header class="topbar">
    <button type="button" class="back-btn" id="backBtn" aria-label="返回">‹</button>
    <div class="topbar-title" id="topTitle">購買入場券</div>
  </header>
  <div class="stage" id="screenMain">
    <h1 id="title">載入中…</h1>
    <p class="lead" id="lead"></p>
    <div id="sessionList"></div>
    <div id="packageList"></div>
    <div id="payBox" style="display:none"><div id="orderSummary"></div><p class="lead">模擬付款（測試）</p></div>
    <div id="doneBox" class="empty" style="display:none">購票完成，資格已綁定帳號。</div>
  </div>
  <div class="footer-bar"><button type="button" class="btn" id="nextBtn" disabled>下一步</button></div>
  <script src="/auth.js"></script>
  <script>
  (function () {
    var state = { eventId: 'qx-exam', step: 'session', sessionId: null, packageId: null, session: null, config: null };
    var els = {
      title: document.getElementById('title'),
      lead: document.getElementById('lead'),
      sessionList: document.getElementById('sessionList'),
      packageList: document.getElementById('packageList'),
      payBox: document.getElementById('payBox'),
      orderSummary: document.getElementById('orderSummary'),
      doneBox: document.getElementById('doneBox'),
      nextBtn: document.getElementById('nextBtn'),
      topTitle: document.getElementById('topTitle'),
      backBtn: document.getElementById('backBtn')
    };
    function dayText(s) {
      if (!s) return '';
      var raw = s.examDate || s.date || s.examStart || '';
      var m = String(raw).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      if (m) {
        var mm = m[2].length === 1 ? '0' + m[2] : m[2];
        var dd = m[3].length === 1 ? '0' + m[3] : m[3];
        return m[1] + '/' + mm + '/' + dd;
      }
      return String(raw).split(/[ T]/)[0] || '';
    }
    function sessions() { return (state.config && state.config.sessions) || []; }
    function packages() { return (state.config && state.config.packages) || []; }
    function formatPrice(n) { return !n ? '免費' : ('NT$ ' + Number(n).toLocaleString('zh-TW')); }
    function render() {
      var ev = state.config || {};
      els.title.textContent = ev.title || '購買入場券';
      if (state.step === 'session') {
        els.lead.textContent = '請選擇場次';
        els.packageList.innerHTML = '';
        els.payBox.style.display = 'none';
        els.doneBox.style.display = 'none';
        var list = sessions();
        if (!list.length) {
          els.sessionList.innerHTML = '<p class="empty">目前沒有可選場次。</p>';
          state.sessionId = null;
        } else {
          els.sessionList.innerHTML = list.map(function (s) {
            var sel = state.sessionId === s.id ? ' selected' : '';
            var day = dayText(s);
            var name = (s.name || '').trim() || day || '場次';
            var place = (s.place || '').replace(/\d{1,2}:\d{2}\s*[–\-]\s*\d{1,2}:\d{2}/g, '').trim();
            place = place.replace(/^[·•\s]+|[·•\s]+$/g, '');
            var meta = day + (place ? ' · ' + place : '');
            return '<button type="button" class="option' + sel + '" data-s="' + s.id + '"><div class="name">' + name + '</div><div class="meta">' + meta + '</div></button>';
          }).join('');
          els.sessionList.querySelectorAll('[data-s]').forEach(function (btn) {
            btn.onclick = function () { state.sessionId = btn.getAttribute('data-s'); render(); };
          });
        }
        els.nextBtn.textContent = packages().length ? '下一步：選禮包' : '下一步：付款';
        els.nextBtn.disabled = !state.sessionId;
      } else if (state.step === 'package') {
        els.lead.textContent = '請選擇禮包';
        els.sessionList.innerHTML = '';
        els.payBox.style.display = 'none';
        els.doneBox.style.display = 'none';
        var list = packages();
        if (!list.length) {
          els.packageList.innerHTML = '<p class="empty">無禮包，可直接付款。</p>';
          state.packageId = 'free';
        } else {
          els.packageList.innerHTML = list.map(function (p) {
            var sel = state.packageId === p.id ? ' selected' : '';
            return '<button type="button" class="option' + sel + '" data-p="' + p.id + '"><div class="name">' + (p.name || '禮包') + '</div><div class="meta">' + (p.desc || '') + '</div><div class="price">' + formatPrice(p.price) + '</div></button>';
          }).join('');
          els.packageList.querySelectorAll('[data-p]').forEach(function (btn) {
            btn.onclick = function () { state.packageId = btn.getAttribute('data-p'); render(); };
          });
        }
        els.nextBtn.textContent = '下一步：付款';
        els.nextBtn.disabled = !state.packageId && list.length;
      } else if (state.step === 'pay') {
        els.lead.textContent = '確認訂單';
        els.sessionList.innerHTML = '';
        els.packageList.innerHTML = '';
        els.payBox.style.display = 'block';
        els.doneBox.style.display = 'none';
        var s = sessions().find(function (x) { return x.id === state.sessionId; }) || {};
        var p = packages().find(function (x) { return x.id === state.packageId; }) || {};
        var pkgName = p.name || (state.packageId === 'free' || !packages().length ? '基本入場（免費）' : state.packageId);
        els.orderSummary.innerHTML =
          '<div class="pay-row"><span>場次</span><span>' + ((s.name || '').trim() || dayText(s) || state.sessionId) + '</span></div>' +
          '<div class="pay-row"><span>日期</span><span>' + dayText(s) + '</span></div>' +
          '<div class="pay-row"><span>禮包</span><span>' + pkgName + '</span></div>' +
          '<div class="pay-row"><span>金額</span><span>' + formatPrice(p.price) + '</span></div>';
        els.nextBtn.textContent = '確認付款';
        els.nextBtn.disabled = false;
      } else if (state.step === 'done') {
        els.lead.textContent = '';
        els.sessionList.innerHTML = '';
        els.packageList.innerHTML = '';
        els.payBox.style.display = 'none';
        els.doneBox.style.display = 'block';
        els.nextBtn.textContent = '完成';
        els.nextBtn.disabled = false;
      }
    }
    els.nextBtn.onclick = function () {
      if (state.step === 'session' && state.sessionId) {
        state.step = packages().length ? 'package' : 'pay';
        if (state.step === 'pay' && !state.packageId) state.packageId = 'free';
        render(); return;
      }
      if (state.step === 'package') { state.step = 'pay'; render(); return; }
      if (state.step === 'pay') {
        try {
          var key = 'mapsky_tickets_v1';
          var arr = JSON.parse(localStorage.getItem(key) || '[]');
          var s = sessions().find(function (x) { return x.id === state.sessionId; }) || {};
          arr.push({ eventId: state.eventId, sessionId: state.sessionId, sessionName: s.name || dayText(s), packageId: state.packageId, at: Date.now() });
          localStorage.setItem(key, JSON.stringify(arr));
        } catch (e) {}
        state.step = 'done'; render(); return;
      }
      if (state.step === 'done') { location.href = '/events-detail.html?event=' + encodeURIComponent(state.eventId); }
    };
    els.backBtn.onclick = function () {
      if (state.step === 'package') { state.step = 'session'; render(); return; }
      if (state.step === 'pay') { state.step = packages().length ? 'package' : 'session'; render(); return; }
      if (history.length > 1) history.back(); else location.href = '/events-detail.html?event=' + encodeURIComponent(state.eventId);
    };
    function boot(session) {
      state.session = session || { loggedIn: false };
      if (!state.session.loggedIn) {
        location.href = '/login?return=' + encodeURIComponent(location.pathname + location.search);
        return;
      }
      var q = new URLSearchParams(location.search);
      state.eventId = q.get('event') || 'qx-exam';
      fetch('/api/events/config').then(function (r) { return r.json(); }).then(function (j) {
        var arr = (j && j.events) || [];
        state.config = arr.find(function (e) { return e.id === state.eventId; }) || arr[0] || { title: '活動', sessions: [], packages: [] };
        if (!Array.isArray(state.config.sessions)) state.config.sessions = [];
        if (!Array.isArray(state.config.packages)) state.config.packages = [];
        state.step = 'session';
        render();
      }).catch(function () {
        state.config = { title: '活動', sessions: [], packages: [] };
        render();
      });
    }
    if (window.MapSkyAuth && MapSkyAuth.session) {
      MapSkyAuth.session().then(function (res) { boot((res && res.body) || { loggedIn: false }); })
        .catch(function () { boot({ loggedIn: false }); });
    } else boot({ loggedIn: false });
  })();
  </script>
</body>
</html>
