<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="MapSky 功能介紹 — 天氣、動態天空、捷運台鐵高鐵、停班停課與 YouBike。" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>功能 — MapSky</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="preload" as="image" href="assets/mountain.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="home is-dark is-scrolled">
  <header class="nav" id="topNav">
    <a class="brand" href="/">
      <img class="logo-img" data-logo="icon" width="36" height="36" alt="MapSky" />
      <img class="wordmark" data-logo="wordmark" height="22" alt="MapSky" />
    </a>
    <button type="button" class="nav-toggle" id="navToggle" aria-label="開啟選單" aria-expanded="false">
      <span></span><span></span>
    </button>
    <div class="nav-right" id="navRight">
      <nav class="nav-links" aria-label="主選單">
        <a href="/#details">畫面</a>
        <a href="/#news">最新消息</a>
        <a href="/features">功能</a>
        <a href="/privacy">隱私與條款</a>
      </nav>
      <div class="nav-actions">
        <span data-auth-slot>
          <a class="btn btn-sm btn-primary" href="/login">登入</a>
        </span>
      </div>
    </div>
  </header>

  <main id="top">
    <div class="ink-top-mark" aria-label="MapSky">
      <img class="ink-brand-mark" src="assets/hero-word.jpg" width="900" height="242" alt="MAPSKY" />
    </div>

    <section class="intro-scene" id="introScene" aria-label="出門前最常查什麼">
      <div class="intro-scene-frame">
        <img id="introBgImg" class="intro-scene-img" src="assets/mountain.svg" alt="" width="1748" height="1240" loading="eager" fetchpriority="high" decoding="async" />
        <div class="intro-scene-overlay" aria-hidden="true"></div>
        <div class="intro-caption is-visible" id="introCaption">
          <p class="intro-caption-kicker">MapSky</p>
          <p class="intro-caption-title">出門前，你最常查什麼？</p>
          <p class="intro-caption-body">
            <span class="tint-weather">天氣</span>、<span class="tint-metro">捷運</span>、<span class="tint-school">停班停課</span>。<br />
            現在，一站看清楚。
          </p>
        </div>
        <div class="intro-tabs" role="tablist" aria-label="場景切換">
          <button type="button" class="intro-tab is-active" data-bg="assets/mountain.svg" data-label="總覽" data-title="出門前，你最常查什麼？" data-tint="mix" data-body="天氣、捷運、停班停課。現在，一站看清楚。" role="tab" aria-selected="true" aria-label="總覽"></button>
          <button type="button" class="intro-tab" data-bg="assets/Weather1.svg" data-label="天氣" data-title="即時天氣與動態天空" data-tint="weather" data-body="溫度、體感、降雨，一眼看懂今天。" role="tab" aria-selected="false" aria-label="天氣"></button>
          <button type="button" class="intro-tab" data-bg="assets/mrt.svg" data-label="捷運" data-title="捷運 · 台鐵 · 高鐵" data-tint="metro" data-body="下一班幾分，站點與班次一次看。" role="tab" aria-selected="false" aria-label="捷運"></button>
          <button type="button" class="intro-tab" data-bg="assets/typhoon1.svg" data-label="停班停課" data-title="停班停課公告" data-tint="school" data-body="縣市地圖著色，出門前先確認。" role="tab" aria-selected="false" aria-label="停班停課"></button>
        </div>
      </div>
    </section>

    <div class="ink-cover">
      <section id="download" class="section section-cta">
        <div class="cta-box">
          <h2>開始使用 MapSky。</h2>
          <p>登入後即可使用同一套帳號；iOS App 即將上架。</p>
          <div class="hero-cta">
            <a class="btn btn-primary" href="/login">登入</a>
            <a class="btn btn-ghost" href="/">回首頁 ›</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-brand"><img class="logo-img" data-logo="icon" width="28" height="28" alt="" /><span>MapSky</span></div>
    <div class="footer-links">
      <a href="/#details">畫面</a><a href="/#news">最新消息</a><a href="/features">功能</a><a href="/privacy">隱私與條款</a><a href="/login">登入</a><a href="mailto:mapskyapp@gmail.com">聯絡我們</a>
    </div>
    <p class="footer-note">Copyright © MapSky. mapskyapp@gmail.com</p>
  </footer>

  <script src="logo-icon.js"></script>
  <script src="logo-wordmark.js"></script>
  <script src="logo-apply.js"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      var toggle = document.getElementById("navToggle");
      var panel = document.getElementById("navRight");
      if (toggle && panel) {
        toggle.addEventListener("click", function () {
          var open = panel.classList.toggle("open");
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
          toggle.classList.toggle("open", open);
          document.body.classList.toggle("nav-open", open);
        });
        panel.querySelectorAll("a").forEach(function (a) {
          a.addEventListener("click", function () {
            panel.classList.remove("open");
            document.body.classList.remove("nav-open");
            toggle.classList.remove("open");
            toggle.setAttribute("aria-expanded", "false");
          });
        });
      }

      var tabs = document.querySelectorAll("#introScene .intro-tab");
      var bgImg = document.getElementById("introBgImg");
      var caption = document.getElementById("introCaption");
      if (!tabs.length || !bgImg) return;
      function setCaption(tab) {
        if (!caption || !tab) return;
        var title = tab.getAttribute("data-title");
        var body = tab.getAttribute("data-body") || "";
        var tint = tab.getAttribute("data-tint") || "weather";
        var titleEl = caption.querySelector(".intro-caption-title");
        var bodyEl = caption.querySelector(".intro-caption-body");
        if (title && titleEl) titleEl.textContent = title;
        if (bodyEl) {
          if (tint === "mix") {
            bodyEl.innerHTML = '<span class="tint-weather">天氣</span>、<span class="tint-metro">捷運</span>、<span class="tint-school">停班停課</span>。<br />現在，一站看清楚。';
          } else {
            bodyEl.innerHTML = '<span class="tint-' + tint + '">' + body + '</span>';
          }
        }
      }
      tabs.forEach(function (tab) {
        tab.addEventListener("click", function () {
          var src = tab.getAttribute("data-bg");
          if (src) {
            bgImg.style.opacity = "0";
            setTimeout(function () {
              if (src.indexOf("mountain") !== -1) bgImg.style.objectPosition = "34% 40%";
              else if (src.indexOf("mrt") !== -1) bgImg.style.objectPosition = "center 45%";
              else if (src.indexOf("typhoon") !== -1) bgImg.style.objectPosition = "center 35%";
              else bgImg.style.objectPosition = "center 42%";
              bgImg.src = src;
              bgImg.onload = function () { bgImg.style.opacity = "1"; };
              if (bgImg.complete) bgImg.style.opacity = "1";
            }, 180);
          }
          setCaption(tab);
          tabs.forEach(function (t) {
            t.classList.toggle("is-active", t === tab);
            t.setAttribute("aria-selected", t === tab ? "true" : "false");
          });
        });
      });
    })();
  </script>
</body>
</html>
