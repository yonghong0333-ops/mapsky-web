<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>活動 — MapSky</title>
  <meta name="description" content="MapSky 活動、Qx 定期評量入場券。" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.page-light { background: #fff; color: #1d1d1f; }
    body.page-light .nav {
      background: rgba(255,255,255,0.92);
      color: #1d1d1f;
      border-bottom-color: rgba(0,0,0,0.06);
    }
    body.page-light .nav-toggle { background: rgba(0,0,0,0.06); }
    body.page-light .nav-toggle span { background: currentColor; }
    body.page-light .wordmark { filter: brightness(0); }
    body.page-light:not(.nav-open) .nav .btn-primary { background: #1d1d1f; color: #fff; }
    body.page-light.nav-open .nav { color: #f5f5f7; background: transparent; }
    body.page-light.nav-open .wordmark { filter: none; }
    body.page-light.nav-open .nav-toggle { background: rgba(255,255,255,0.18); }
    body.page-light.nav-open .nav-toggle span { background: #f5f5f7; }
    @media (max-width: 768px) {
      body.page-light .nav-right { color: #f5f5f7; }
    }
    .events {
      max-width: 760px;
      margin: 0 auto;
      padding: calc(var(--nav-h, 56px) + 28px) 24px 80px;
    }
    .events h1 {
      font-size: 32px;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
      color: #1d1d1f;
    }
    .events .meta {
      color: #6e6e73;
      margin: 0 0 32px;
      font-size: 14px;
    }
    .event-list { display: grid; gap: 16px; }
    .event-card {
      background: #f5f5f7;
      border-radius: 20px;
      padding: 24px 22px;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .event-card.featured {
      background: linear-gradient(165deg, #0a0a0a 0%, #1c1c1e 100%);
      color: #f5f5f7;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .event-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 10px;
    }
    .event-card h2 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    .event-card.featured h2 { color: #fff; }
    .event-card p {
      margin: 0 0 12px;
      color: #6e6e73;
      font-size: 15px;
      line-height: 1.55;
    }
    .event-card.featured p { color: rgba(255,255,255,0.68); }
    .event-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin: 16px 0 20px;
      font-size: 14px;
      color: rgba(255,255,255,0.55);
    }
    .event-meta-row strong { color: #fff; font-weight: 600; }
    .event-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .btn-buy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 980px;
      border: 0;
      background: #fff;
      color: #0a0a0a;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-buy:hover { opacity: 0.92; }
    .btn-buy:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-outline {
      display: inline-flex;
      align-items: center;
      padding: 11px 18px;
      border-radius: 980px;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: transparent;
      color: #f5f5f7;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
    }
    .ticket-status {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255,255,255,0.85);
    }
    .ticket-status.ok {
      background: rgba(52, 199, 89, 0.15);
      color: #30d158;
    }
    .ticket-status strong { color: #fff; }
    .ticket-status.ok strong { color: #30d158; }
    .hint-sm {
      margin: 10px 0 0;
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      line-height: 1.45;
    }
    .event-empty {
      text-align: center;
      padding: 48px 20px;
      border-radius: 20px;
      background: #f5f5f7;
      color: #6e6e73;
    }
    .event-empty strong {
      display: block;
      color: #1d1d1f;
      font-size: 17px;
      margin-bottom: 8px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 4000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(400px, 100%);
      background: #fff;
      border-radius: 20px;
      padding: 24px 22px;
      color: #1d1d1f;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
    }
    .modal h3 {
      margin: 0 0 8px;
      font-size: 18px;
      letter-spacing: -0.015em;
    }
    .modal p {
      margin: 0 0 18px;
      color: #6e6e73;
      font-size: 14px;
      line-height: 1.5;
    }
    .modal .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    .modal .row:last-of-type { border-bottom: 0; margin-bottom: 16px; }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }
    .modal-actions button {
      padding: 10px 18px;
      border-radius: 980px;
      border: 0;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-actions .cancel {
      background: #f5f5f7;
      color: #1d1d1f;
    }
    .modal-actions .confirm {
      background: #1d1d1f;
      color: #fff;
    }
    .site-footer {
      background: #f5f5f7;
      color: #6e6e73;
      padding: 36px 24px 28px;
      text-align: center;
      font-size: 13px;
    }
    .site-footer a { color: #1d1d1f; text-decoration: none; margin: 0 8px; }
    .site-footer a:hover { color: #0066cc; }
  </style>
</head>
<body class="page-light">
  <header class="nav" id="topNav">
    <a class="brand" href="/">
      <img class="logo-img" data-logo="icon" width="36" height="36" alt="MapSky" />
      <img class="wordmark" data-logo="wordmark" height="22" alt="MapSky" />
    </a>
    <button type="button" class="nav-toggle" id="navToggle" aria-label="開啟選單" aria-expanded="false">
      <span></span><span></span>
    </button>
    <div class="nav-right" id="navRight">
      <nav class="nav-links" aria-label="主選單">
        <a href="/#news">最新消息</a>
        <a href="/events">活動</a>
        <a href="/features">適用裝置</a>
        <a href="/privacy">隱私與條款</a>
      </nav>
      <div class="nav-actions">
        <span data-auth-slot>
          <a class="btn btn-sm btn-primary" href="/login">登入</a>
        </span>
      </div>
    </div>
  </header>

  <main class="events">
    <h1>活動</h1>
    <p class="meta">官方活動、入場券與合作訊息 · 購票採帳號綁定</p>

    <div class="event-list" id="eventList"></div>
  </main>

  <div class="modal-backdrop" id="buyModal" role="dialog" aria-modal="true" aria-labelledby="buyTitle">
    <div class="modal">
      <h3 id="buyTitle">確認購買入場券</h3>
      <p id="buyDesc">購買後入場資格會綁定你的 MapSky 帳號，並同步至 App。</p>
      <div class="row"><span>活動</span><strong id="buyEventName">Qx 定期評量</strong></div>
      <div class="row"><span>金額</span><strong id="buyPrice">—</strong></div>
      <div class="row"><span>帳號</span><strong id="buyAccount">—</strong></div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="buyCancel">取消</button>
        <button type="button" class="confirm" id="buyConfirm">確認購買</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div>
      <a href="/#news">最新消息</a>
      <a href="/events">活動</a>
      <a href="/features">適用裝置</a>
      <a href="/privacy">隱私與條款</a>
      <a href="/login">登入</a>
    </div>
    <p style="margin:16px 0 0;color:#6e6e73">Copyright © MapSky · mapskyapp@gmail.com</p>
  </footer>

  <script src="logo-icon.js"></script>
  <script src="logo-wordmark.js"></script>
  <script src="logo-apply.js"></script>
  <script src="auth.js"></script>
  <script src="nav-scroll.js?v=23"></script>
  <script>
    (function () {
      var CONFIG_KEY = 'mapsky_events_config_v1';
      var TICKETS_KEY = 'mapsky_tickets_v1';

      var DEFAULT_EVENTS = [
        {
          id: 'qx-exam',
          enabled: true,
          badge: '定期評量',
          title: 'Qx 定期評量',
          description: '參加 Qx 定期評量活動。購買入場券後，資格會綁定你的 MapSky 帳號，並回報至 MapSky App。',
          schedule: '依後台公告場次',
          price: 0,
          currency: 'TWD',
          priceLabel: '免費開放',
          ticketLabel: '領取入場券'
        }
      ];

      function loadConfig() {
        try {
          var raw = localStorage.getItem(CONFIG_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length) return parsed;
          }
        } catch (e) {}
        return DEFAULT_EVENTS.map(function (e) { return Object.assign({}, e); });
      }

      function loadTickets() {
        try {
          var raw = localStorage.getItem(TICKETS_KEY);
          if (raw) return JSON.parse(raw) || {};
        } catch (e) {}
        return {};
      }

      function saveTickets(map) {
        try { localStorage.setItem(TICKETS_KEY, JSON.stringify(map)); } catch (e) {}
      }

      function formatPrice(ev) {
        if (ev.priceLabel) return ev.priceLabel;
        if (!ev.price || Number(ev.price) === 0) return '免費';
        return 'NT$ ' + Number(ev.price).toLocaleString('zh-TW');
      }

      function userKey(session) {
        if (!session || !session.loggedIn) return null;
        var p = session.profile || session.user || session;
        return String(p.email || p.id || p.name || '').trim().toLowerCase() || null;
      }

      function hasTicket(tickets, uid, eventId) {
        if (!uid || !tickets[uid]) return false;
        return !!tickets[uid][eventId];
      }

      function render(session) {
        var list = document.getElementById('eventList');
        if (!list) return;
        var events = loadConfig().filter(function (e) { return e.enabled !== false; });
        var tickets = loadTickets();
        var uid = userKey(session);

        if (!events.length) {
          list.innerHTML = '<div class="event-empty"><strong>目前沒有進行中的活動</strong>有新活動時會在這裡公布。</div>';
          return;
        }

        list.innerHTML = events.map(function (ev) {
          var owned = hasTicket(tickets, uid, ev.id);
          var priceText = formatPrice(ev);
          var statusHtml = '';
          if (owned) {
            var t = tickets[uid][ev.id];
            statusHtml =
              '<div class="ticket-status ok">' +
              '<strong>已持有入場券</strong><br />' +
              '綁定帳號：' + (t.email || uid) + '<br />' +
              '購買時間：' + (t.at || '—') + '<br />' +
              '狀態：已回報 MapSky App（帳號綁定）' +
              '</div>';
          }
          var buyLabel = owned ? '已購買' : (ev.ticketLabel || '購買入場券');
          var buyDisabled = owned ? ' disabled' : '';
          return (
            '<article class="event-card featured" data-event-id="' + ev.id + '">' +
            '<div class="event-badge">' + (ev.badge || '活動') + '</div>' +
            '<h2>' + (ev.title || '活動') + '</h2>' +
            '<p>' + (ev.description || '') + '</p>' +
            '<div class="event-meta-row">' +
            '<span>場次 <strong>' + (ev.schedule || '待公告') + '</strong></span>' +
            '<span>費用 <strong>' + priceText + '</strong></span>' +
            '</div>' +
            '<div class="event-actions">' +
            '<button type="button" class="btn-buy" data-buy="' + ev.id + '"' + buyDisabled + '>' + buyLabel + '</button>' +
            (!session || !session.loggedIn
              ? '<a class="btn-outline" href="/login?return=' + encodeURIComponent('/events') + '">先登入帳號</a>'
              : '') +
            '</div>' +
            statusHtml +
            '<p class="hint-sm">入場券採帳號綁定制：購買後與你的 MapSky 帳號連結，App 端可查詢資格。金流與後台設定完成後會自動對接正式 API。</p>' +
            '</article>'
          );
        }).join('');

        list.querySelectorAll('[data-buy]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            onBuyClick(btn.getAttribute('data-buy'), session);
          });
        });
      }

      var pendingEventId = null;

      function onBuyClick(eventId, session) {
        if (!session || !session.loggedIn) {
          location.href = '/login?return=' + encodeURIComponent('/events');
          return;
        }
        var uid = userKey(session);
        var tickets = loadTickets();
        if (hasTicket(tickets, uid, eventId)) return;

        var ev = loadConfig().find(function (e) { return e.id === eventId; });
        if (!ev) return;

        pendingEventId = eventId;
        document.getElementById('buyEventName').textContent = ev.title || '活動';
        document.getElementById('buyPrice').textContent = formatPrice(ev);
        var p = session.profile || session.user || session;
        document.getElementById('buyAccount').textContent = p.email || p.nickname || p.name || uid;
        document.getElementById('buyModal').classList.add('open');
      }

      function closeModal() {
        pendingEventId = null;
        document.getElementById('buyModal').classList.remove('open');
      }

      function confirmPurchase(session) {
        if (!pendingEventId || !session || !session.loggedIn) return;
        var uid = userKey(session);
        var p = session.profile || session.user || session;
        var tickets = loadTickets();
        if (!tickets[uid]) tickets[uid] = {};
        tickets[uid][pendingEventId] = {
          eventId: pendingEventId,
          email: p.email || '',
          name: p.nickname || p.name || '',
          at: new Date().toLocaleString('zh-TW', { hour12: false }),
          bound: true,
          syncedToApp: true,
          orderId: 'local-' + Date.now()
        };
        saveTickets(tickets);
        closeModal();
        render(session);
      }

      document.getElementById('buyCancel').addEventListener('click', closeModal);
      document.getElementById('buyModal').addEventListener('click', function (e) {
        if (e.target === this) closeModal();
      });

      var toggle = document.getElementById('navToggle');
      var panel = document.getElementById('navRight');
      if (toggle && panel) {
        toggle.addEventListener('click', function () {
          var open = panel.classList.toggle('open');
          toggle.classList.toggle('open', open);
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          document.body.classList.toggle('nav-open', open);
        });
        panel.querySelectorAll('a').forEach(function (a) {
          a.addEventListener('click', function () {
            panel.classList.remove('open');
            toggle.classList.remove('open');
            toggle.setAttribute('aria-expanded', 'false');
            document.body.classList.remove('nav-open');
          });
        });
      }

      var currentSession = null;
      document.getElementById('buyConfirm').addEventListener('click', function () {
        confirmPurchase(currentSession);
      });

      function boot() {
        if (window.MapSkyAuth && MapSkyAuth.session) {
          MapSkyAuth.session().then(function (res) {
            currentSession = (res && res.body) ? res.body : { loggedIn: false };
            render(currentSession);
          }).catch(function () {
            currentSession = { loggedIn: false };
            render(currentSession);
          });
        } else {
          currentSession = { loggedIn: false };
          render(currentSession);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
